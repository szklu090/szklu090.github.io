/* --- 7.4 CRM --- */
function clientProfiles() {
  const map = new Map();
  store.orders.forEach((o) => {
    const key = clientKey(o);
    if (!map.has(key)) map.set(key, { key, name: o.client.name, phone: o.client.phone, messenger: o.client.messenger, orders: [], total: 0, unpaid: 0, cakes: {}, last: null });
    const c = map.get(key);
    c.orders.push(o);
    c.total += orderTotal(o);
    if (!o.finance.paid) c.unpaid += orderTotal(o);
    if (o.client.phone && !c.phone) c.phone = o.client.phone;
    if (o.client.messenger && !c.messenger) c.messenger = o.client.messenger;
    if (o.client.name && o.client.name.length >= c.name.length) c.name = o.client.name;
    orderItems(o).forEach((it) => { const r = itemRecipe(it); if (r) c.cakes[r.name] = (c.cakes[r.name] || 0) + (it.qty || 1); });
    const t = new Date(o.logistics.dueAt || o.createdAt).getTime();
    if (!c.last || t > new Date(c.last.logistics.dueAt || c.last.createdAt).getTime()) c.last = o;
  });
  map.forEach((c) => {
    const stored = store.clients.find((x) => x.key === c.key);
    c.note = stored ? stored.note : '';
    c.tags = stored ? (stored.tags || []) : [];
    c.favCake = Object.entries(c.cakes).sort((a, b) => b[1] - a[1])[0];
    c.active = c.orders.filter((o) => o.status !== 'done').length;
    c.upcoming = c.orders.filter((o) => o.status !== 'done' && o.logistics.dueAt).sort((a, b) => new Date(a.logistics.dueAt) - new Date(b.logistics.dueAt))[0] || null;
  });
  return Array.from(map.values()).sort((a, b) => (b.last ? new Date(b.last.logistics.dueAt || b.last.createdAt) : 0) - (a.last ? new Date(a.last.logistics.dueAt || a.last.createdAt) : 0));
}

/* --- 7.5 KPI I ANALITYKA --- */
function kpis() {
  const now = new Date();
  const mStart = startOfMonth(now), pmStart = startOfMonth(addDays(mStart, -1));
  const done = store.orders.filter((o) => o.status === 'done');
  const all = store.orders;
  const revMonth = sum(all.filter((o) => new Date(o.logistics.dueAt || o.createdAt) >= mStart), orderTotal);
  const revPrev = sum(all.filter((o) => { const d = new Date(o.logistics.dueAt || o.createdAt); return d >= pmStart && d < mStart; }), orderTotal);
  const active = all.filter((o) => o.status !== 'done');
  const unpaid = sum(active.filter((o) => !o.finance.paid), orderTotal);
  const today = active.filter((o) => o.logistics.dueAt && sameDay(new Date(o.logistics.dueAt), now));
  const week = active.filter((o) => o.logistics.dueAt && dayDiff(new Date(o.logistics.dueAt), now) >= 0 && dayDiff(new Date(o.logistics.dueAt), now) <= 7);
  const costSum = sum(active, (o) => orderCost(o).total);
  const revActive = sum(active, orderTotal);
  return {
    revMonth, revPrev, revDelta: revPrev ? (revMonth - revPrev) / revPrev : (revMonth > 0 ? 1 : 0),
    active: active.length, unpaid, today: today.length, week: week.length,
    todayMoney: sum(today, orderTotal), weekMoney: sum(week, orderTotal),
    avgOrder: all.length ? sum(all, orderTotal) / all.length : 0,
    doneCount: done.length,
    margin: revActive > 0 ? (revActive - costSum) / revActive : 0,
    profitMonth: sum(all.filter((o) => new Date(o.logistics.dueAt || o.createdAt) >= mStart), (o) => orderTotal(o) - orderCost(o).total)
  };
}
function revenueByWeek(weeks) {
  weeks = weeks || 8;
  const out = [];
  for (let i = weeks - 1; i >= 0; i--) {
    const s = startOfWeek(addDays(new Date(), -7 * i));
    const e = addDays(s, 7);
    const val = sum(store.orders.filter((o) => { const d = new Date(o.logistics.dueAt || o.createdAt); return d >= s && d < e; }), orderTotal);
    const cnt = store.orders.filter((o) => { const d = new Date(o.logistics.dueAt || o.createdAt); return d >= s && d < e; }).length;
    out.push({ label: pad2(s.getDate()) + '.' + pad2(s.getMonth() + 1), value: val, count: cnt });
  }
  return out;
}
function ordersByRecipe() {
  const map = {};
  store.orders.forEach((o) => orderItems(o).forEach((it) => { const r = itemRecipe(it); if (r) map[r.name] = (map[r.name] || 0) + (it.qty || 1); }));
  return Object.entries(map).map(([label, value]) => ({ label, value })).sort((a, b) => b.value - a.value);
}
function ordersByWeekday() {

}

/* ==================== 9. WYKRESY (CANVAS) =================== */
const PALETTE = ['--accent', '--blue', '--violet', '--orange', '--green', '--yellow', '--pink-strong', '--red'];
function cssVar(name) {
  try {
    const v = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    return v || '#c8765e';
  } catch (e) { return '#c8765e'; }
}
function resolveColor(c) {
  if (!c) return cssVar('--accent');
  const m = /var\((--[\w-]+)\)/.exec(c);
  return m ? cssVar(m[1]) : c;
}
function prepCanvas(canvas, h) {
  if (!canvas || !canvas.getContext) return null;
  const dpr = (window.devicePixelRatio || 1);
  let w = 0;
  try { w = Math.round(canvas.getBoundingClientRect().width || (canvas.parentElement && canvas.parentElement.clientWidth) || 600); } catch (e) { w = 600; }
  w = Math.max(220, w);
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  canvas.style.height = h + 'px';
  const ctx = canvas.getContext('2d');
  if (!ctx) return null;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  ctx.textBaseline = 'alphabetic';
  return { ctx, w, h };
}
function roundRect(ctx, x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function drawBars(canvas, rows, opts) {
  opts = opts || {};
  const h = opts.height || 210;
  const P = prepCanvas(canvas, h);
  if (!P) return;
  const { ctx, w } = P;
  const pad = { t: 18, r: 8, b: 30, l: 8 };
  const max = Math.max(1, ...rows.map((r) => r.value || 0));
  const bw = (w - pad.l - pad.r) / Math.max(1, rows.length);
  ctx.strokeStyle = cssVar('--line'); ctx.lineWidth = 1;
  for (let i = 0; i <= 4; i++) {
    const y = pad.t + (h - pad.t - pad.b) * (i / 4);
    ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(w - pad.r, y); ctx.stroke();
  }
  rows.forEach((r, i) => {
    const bh = (h - pad.t - pad.b) * ((r.value || 0) / max);
    const rw = bw * 0.62;
    const x = pad.l + i * bw + (bw - rw) / 2;
    const y = h - pad.b - bh;
    const col = resolveColor(r.color || opts.color || '--accent');
    const grad = ctx.createLinearGradient(0, y, 0, h - pad.b);
    grad.addColorStop(0, col);
    grad.addColorStop(1, cssVar('--accent-soft'));
    ctx.fillStyle = grad;
    roundRect(ctx, x, y, rw, Math.max(2, bh), 6);
    ctx.fill();
    ctx.fillStyle = cssVar('--text-soft');
    ctx.font = '10px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(r.label, x + rw / 2, h - pad.b + 14);
    if (r.value > 0) {
      ctx.fillStyle = cssVar('--text');
      ctx.font = 'bold 10px sans-serif';
      ctx.fillText(opts.money ? fmtMoney(Math.round(r.value)) : String(r.value), x + rw / 2, y - 5);
    }
  });
}
function drawDonut(canvas, rows, opts) {
  opts = opts || {};
  const h = opts.height || 220;
  const P = prepCanvas(canvas, h);
  if (!P) return;
  const { ctx, w } = P;
  if (!w) return;
  const cx = w / 2, cy = h / 2, R = Math.min(w, h) / 2 - 10, r = R * 0.58;
  const total = sum(rows, (x) => x.value) || 1;
  let a = -Math.PI / 2;
  rows.forEach((row, i) => {
    if (!row.value) return;
    const ang = (row.value / total) * Math.PI * 2;
    ctx.beginPath(); ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, R, a, a + ang); ctx.closePath();
    ctx.fillStyle = resolveColor(row.color || PALETTE[i % PALETTE.length]);
    ctx.fill();
    a += ang;
  });
  ctx.globalCompositeOperation = 'destination-out';
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
  ctx.globalCompositeOperation = 'source-over';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = cssVar('--text');
  ctx.font = 'bold 22px sans-serif';
  ctx.fillText(String(opts.centerValue != null ? opts.centerValue : total), cx, cy - 8);
  ctx.fillStyle = cssVar('--muted');
  ctx.font = '10px sans-serif';
  ctx.fillText(opts.center || 'szt.', cx, cy + 14);
}
function legendHTML(rows) {
  return '<div class="legend">' + rows.map((r, i) =>
    '<span><i style="background:' + resolveColor(r.color || PALETTE[i % PALETTE.length]) + '"></i>' + esc(r.label) + ' · <b>' + r.value + '</b></span>'
  ).join('') + '</div>';
}
function statCard(o) {
  return '<div class="stat' + (o.action ? ' clickable' : '') + '" style="--tint:' + (o.tint || 'var(--pink)') + '"' +
    (o.action ? ' data-action="' + o.action + '"' + (o.view ? ' data-view="' + o.view + '"' : '') : '') + '>' +
    (o.ico ? '<span class="stat-ico">' + o.ico + '</span>' : '') +
    '<div class="stat-label">' + esc(o.label) + '</div>' +
    '<div class="stat-value">' + o.value + (o.unit ? '<small>' + esc(o.unit) + '</small>' : '') + '</div>' +
    (o.foot ? '<div class="stat-foot">' + o.foot + '</div>' : '') +
    '</div>';
}

      const money = sum(evs, orderTotal);
      return '<div class="' + cls.join(' ') + '" data-action="cal-select" data-date="' + key + '">' +
        '<div class="cal-num">' + d.getDate() + (money ? '<span class="sum">' + fmtMoney(money) + '</span>' : '') + '</div>' +
        evs.slice(0, 3).map((o) => '<div class="cal-ev ' + (o.logistics.type === 'delivery' ? 'delivery' : 'pickup') + '" title="' + esc(o.client.name + ' · ' + itemsSummary(o)) + '">' + fmtTime(o.logistics.dueAt) + ' ' + esc(o.client.name.split(' ')[0]) + '</div>').join('') +
        (evs.length > 3 ? '<div class="cal-more">+' + (evs.length - 3) + ' więcej</div>' : '') +
        '</div>';
    }).join('') + '</div>';

  const selDay = store.calSelected ? new Date(store.calSelected + 'T00:00:00') : new Date();
  const selEvs = (ordersByDay[store.calSelected] || []).sort((a, b) => new Date(a.logistics.dueAt) - new Date(b.logistics.dueAt));
  const detail = '<div class="panel" style="margin-top:14px"><div class="panel-head"><h3>' + (store.calSelected ? fmtDateFull(selDay) : 'Wybierz dzień') + '</h3><span class="sub">' + selEvs.length + ' zamówień</span><div class="grow"></div>' +
    '<button class="btn btn-xs" data-action="new-order">➕ Dodaj</button>' +
    '<button class="btn btn-xs" data-action="plan-open" data-date="' + esc(store.calSelected) + '">Otwórz plan dnia</button></div>' +
    '<div class="panel-body tight">' + (selEvs.length ? '<div class="stack" style="gap:8px">' + selEvs.map((o) =>
      '<div class="listrow"><div class="avatar">' + esc(initials(o.client.name)) + '</div>' +
      '<div class="grow"><b>' + esc(o.client.name) + '</b> · ' + esc(itemsSummary(o)) + '<div class="tiny muted">' + fmtTime(o.logistics.dueAt) + ' · ' + logisticsLabel(o) + '</div></div>' +
      '<button class="btn btn-xs" data-action="open-order" data-id="' + o.id + '">Otwórz</button></div>').join('') + '</div>'
      : '<div class="empty-state" style="padding:22px"><div class="big">📭</div>Brak zamówień tego dnia.</div>') + '</div></div>';

  return '<div class="panel"><div class="panel-body">' + head + grid + '</div></div>' + detail;
}

      '<td>' + (c.phone ? '📞 ' + esc(c.phone) : '') + (c.messenger ? '<br>💬 ' + esc(c.messenger) : '') + (!c.phone && !c.messenger ? '<span class="muted">—</span>' : '') + '</td>' +
      '<td class="num">' + c.orders.length + (c.active ? ' <span class="pill-count">' + c.active + ' akt.</span>' : '') + '</td>' +
      '<td class="num strong">' + fmtMoney(c.total) + ' zł</td>' +

/* ==================== 14. WIDOK — RECEPTURY =================== */
function recipeCard(r) {
  store.recipeSize = store.recipeSize || {};
  const sizeId = store.recipeSize[r.id] || baseSize(r).id;
  const sc = scaleRecipe(r, sizeId);
  const cfg = store.settings.pricing;
  const packaging = cfg.packagingPerCake;
  const price = sc.size ? sc.size.price : 0;
  const cost = sc.cost + packaging;
  const margin = price > 0 ? (price - cost) / price : 0;
  const open = store.openRecipes.has('recipe:' + r.id);
  const contains = r.contains || [];

  return '<div class="panel">' +
    '<div class="panel-head"><span style="font-size:22px">' + r.emoji + '</span>' +
    '<div><h3>' + esc(r.name) + '</h3><span class="sub">' + r.sizes.length + ' rozmiarów · bazowo ' + (baseSize(r).label) + '</span></div>' +
    '<div class="grow"></div>' +
    '<div class="row tight"><span class="tag">Cena <b>' + fmtMoney(price) + ' zł</b></span>' +
    '<span class="tag" style="background:var(--green-bg);border-color:var(--green-line);color:var(--green)">Marża <b>' + fmtPct(margin) + '</b></span></div>' +
    '</div>' +
    '<div class="panel-body">' +
    (contains.length ? '<div class="chips" style="margin-bottom:10px">' + contains.map((c) => '<span class="tag allergen">⚠ ' + esc(c) + '</span>').join('') + '</div>' : '') +
    '<div class="seg" style="margin-bottom:12px">' + r.sizes.map((s) =>
      '<button data-action="recipe-size" data-recipe="' + r.id + '" data-size="' + s.id + '" aria-pressed="' + (s.id === sizeId) + '">' + esc(s.label) + ' · ' + s.portions + ' porcji</button>'
    ).join('') + '</div>' +
    '<div class="grid" style="grid-template-columns:1fr 1fr;gap:14px">' +
    '<div><div class="sect-title">Składniki (na ' + esc(sc.size ? sc.size.label : '') + ')</div>' +
    sc.items.map((ing) => '<div class="ing"><span class="nm">' + esc(ing.name) + '</span><span class="amt">' + fmtNum(ing.amount) + ' ' + ing.unit + ' · ' + fmtMoney(ing.cost) + ' zł</span></div>').join('') +
    '<div class="ing" style="border-top:2px solid var(--line-strong);margin-top:6px;padding-top:6px"><span class="nm strong">Razem materiał</span><span class="amt">' + fmtMoney(sc.cost) + ' zł</span></div>' +
    '<div class="ing"><span class="nm">Opakowanie</span><span class="amt">' + fmtMoney(packaging) + ' zł</span></div>' +
    '<div class="ing"><span class="nm strong">Koszt bazowy</span><span class="amt">' + fmtMoney(cost) + ' zł</span></div>' +
    '</div>' +
    '<div><div class="sect-title">Technologia</div>' +
    '<div class="tech-grid">' +
    '<div class="tech-cell"><div class="k">Temperatura</div><div class="v">' + esc(r.tech.temp) + '</div></div>' +
    '<div class="tech-cell"><div class="k">Tryb</div><div class="v">' + esc(r.tech.mode) + '</div></div>' +
    '<div class="tech-cell"><div class="k">Pieczenie</div><div class="v">' + esc(r.tech.bakeTime) + '</div></div>' +
    '<div class="tech-cell"><div class="k">Studzenie</div><div class="v">' + esc(r.tech.coolTime) + '</div></div>' +
    '</div>' +
    '<div class="sect-title" style="margin-top:12px">Cennik</div>' +
    '<table class="tbl"><tbody>' + r.sizes.map((s) =>
      '<tr><td>' + esc(s.label) + '</td><td class="num">' + s.portions + ' porcji</td><td class="num strong">' + fmtMoney(s.price) + ' zł</td></tr>'
    ).join('') + '</tbody></table>' +
    '</div></div>' +
    '<button class="recipe-toggle" style="margin-top:12px" data-action="toggle-recipe" data-id="recipe:' + r.id + '" aria-expanded="' + open + '">' +
    '<span>⚠️ Uwagi i kroki przygotowania</span><span class="caret">▾</span></button>' +
    (open ? '<div class="recipe-body"><div class="recipe-sec"><h4>Uwagi</h4><ul class="warn-list">' + r.warnings.map((w) => '<li>' + esc(w) + '</li>').join('') + '</ul></div>' +
      '<div class="recipe-sec"><h4>Kroki</h4><ol class="steps">' + r.steps.map((s) => '<li>' + esc(s) + '</li>').join('') + '</ol></div></div>' : '') +

function renderReceptury() {

        '<td class="mono">' + esc(o.code || '—') + '</td>' +

        '<td>' + fmtWhen(o.logistics.dueAt) + '</td></tr>';

/* ==================== 16. WIDOK — ZAKUPY =================== */
function renderZakupy() {
  store.shopRange = store.shopRange || 'planned';
  const range = store.shopRange;
  const rows = aggregatedShopping(range);
  const bought = store.shopping.bought[shoppingBoughtKey(range)] || {};
  const byCat = {};
  rows.forEach((r) => { (byCat[r.cat] = byCat[r.cat] || []).push(r); });
  const totalCost = sum(rows, (r) => r.toBuy * r.unitCost);
  const toBuyCount = rows.filter((r) => r.toBuy > 0).length;

  const head = '<div class="panel"><div class="panel-body tight"><div class="row">' +
    segRow('shopRange', range, [{ v: 'planned', t: 'Zaplanowane' }, { v: 'week', t: '7 dni' }, { v: 'today', t: 'Dziś' }, { v: 'all', t: 'Wszystkie aktywne' }]) +
    '<span class="grow"></span>' +
    '<span class="tag">Do kupienia: <b>' + toBuyCount + '</b></span>' +
    '<span class="tag">Szac. koszt: <b>' + fmtMoney(totalCost) + ' zł</b></span>' +
    '<button class="btn btn-sm" data-action="clear-bought">Wyczyść odhaczone</button>' +
    '<button class="btn btn-sm" data-action="print-shopping">🖨️ Drukuj</button>' +
    '<button class="btn btn-sm" data-action="csv-shopping">📤 CSV</button>' +
    '</div></div></div>';

  const list = rows.length ? Object.keys(byCat).sort((a, b) => catMeta(a).name.localeCompare(catMeta(b).name, 'pl')).map((cat) =>
    '<div class="panel"><div class="panel-head"><span>' + catMeta(cat).emoji + '</span><h3>' + esc(catMeta(cat).name) + '</h3><span class="sub">' + byCat[cat].length + ' poz.</span></div>' +
    '<div class="panel-body tight"><div class="stack" style="gap:6px">' + byCat[cat].map((r) => {
      const isBought = !!bought[r.key];
      return '<label class="listrow" style="cursor:pointer;' + (isBought ? 'opacity:.55' : '') + '">' +
        '<input type="checkbox" data-action="buy-toggle" data-key="' + esc(r.key) + '" ' + (isBought ? 'checked' : '') + ' style="accent-color:var(--accent);width:18px;height:18px">' +
        '<span class="grow"' + (isBought ? ' style="text-decoration:line-through"' : '') + '>' + esc(r.name) +
        (r.have > 0 ? ' <span class="tag diet">w spiżarni ' + fmtNum(r.have) + ' ' + r.unit + '</span>' : '') + '</span>' +
        '<span class="strong mono">' + fmtNum(r.toBuy) + ' ' + r.unit + '</span>' +
        '<span class="tiny muted mono">' + fmtMoney(r.toBuy * r.unitCost) + ' zł</span>' +
        '<span class="tiny muted">' + r.orders.length + ' zam.</span>' +
        '</label>';
    }).join('') + '</div></div></div>').join('')
    : '<div class="panel"><div class="empty-state"><div class="big">🛒</div>Brak składników do kupienia w wybranym zakresie.</div></div>';

  const pantry = '<div class="panel"><div class="panel-head"><h3>🧺 Spiżarnia</h3><span class="sub">' + store.pantry.length + ' pozycji</span></div>' +
    '<div class="panel-body">' +
    '<div class="row" style="margin-bottom:10px">' +
    '<input type="text" id="pantryName" placeholder="Składnik (np. Ser kremowy)" style="flex:1 1 160px;padding:9px 11px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface-2)">' +
    '<input type="number" id="pantryQty" placeholder="Ilość" min="0" step="0.1" style="width:90px;padding:9px 11px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface-2)">' +
    '<select id="pantryUnit" style="padding:9px 11px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface-2)"><option>g</option><option>ml</option><option>szt</option></select>' +
    '<button class="btn btn-sm btn-primary" data-action="pantry-add">Dodaj</button>' +
    '</div>' +
    (store.pantry.length ? '<div class="stack" style="gap:6px">' + store.pantry.map((p, i) =>
      '<div class="listrow"><span class="grow">' + esc(p.name) + '</span><b class="mono">' + fmtNum(p.qty) + ' ' + p.unit + '</b>' +
      '<button class="btn btn-xs btn-ghost" data-action="pantry-del" data-idx="' + i + '">🗑️</button></div>').join('') + '</div>'
      : '<div class="tiny muted">Dodaj to, co masz w domu — lista zakupów automatycznie to odejmie.</div>') +
    '</div></div>';

  const manual = '<div class="panel"><div class="panel-head"><h3>✍️ Dodatkowe zakupy</h3></div><div class="panel-body">' +
    '<div class="row" style="margin-bottom:10px">' +
    '<input type="text" id="manualItem" placeholder="np. Świeczki, balon, kwiaty" style="flex:1 1 200px;padding:9px 11px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface-2)">' +
    '<button class="btn btn-sm" data-action="manual-add">Dodaj</button></div>' +
    (store.shopping.manual.length ? '<div class="stack" style="gap:6px">' + store.shopping.manual.map((m, i) =>
      '<div class="listrow"><label class="grow" style="cursor:pointer"><input type="checkbox" style="margin-right:8px;accent-color:var(--accent)">' + esc(m) + '</label>' +
      '<button class="btn btn-xs btn-ghost" data-action="manual-del" data-idx="' + i + '">🗑️</button></div>').join('') + '</div>'
      : '<div class="tiny muted">Lista rzeczy poza recepturami.</div>') +
    '</div></div>';

  return '<div class="stack">' + head + '<div class="grid g2" style="align-items:start">' + pantry + manual + '</div>' + list + '</div>';
}

function openModal(inner) {

function syncEditorFromDOM() {
  const root = $('#orderEditor');
  if (!root || !editDraft) return;
  $$('[data-field]', root).forEach((el) => {
    const path = el.getAttribute('data-field');
    let val;
    if (el.type === 'checkbox') val = el.checked;
    else if (el.type === 'radio') { if (!el.checked) return; val = el.value; }
    else val = el.value;
    const parts = path.split('.');
    let obj = editDraft;
    for (let i = 0; i < parts.length - 1; i++) { if (!obj[parts[i]]) obj[parts[i]] = {}; obj = obj[parts[i]]; }
    obj[parts[parts.length - 1]] = val;
  });
  editDraft.items.forEach((it, i) => {
    const row = root.querySelector('[data-item-row="' + i + '"]');
    if (!row) return;
    $$('[data-ifield]', row).forEach((el) => {
      const f = el.getAttribute('data-ifield');
      let v = el.value;
      if (f === 'qty') v = Math.max(1, parseInt(v, 10) || 1);
      else if (f === 'priceOverride') v = v === '' ? null : Math.max(0, Number(v) || 0);
      else if (f === 'personal' || f === 'allergens') v = v.split(',').map((s) => s.trim()).filter(Boolean);
      it[f] = v;
    });
  });
}
function updateSurchargePreview() {
  const box = $('#editSurcharges');
  if (!box || !editDraft) return;
  const sur = surchargesFor(editDraft.items, editDraft.logistics, editDraft.logistics.dueAt);
  const auto = sur.reduce((s, x) => s + x.value, 0);
  const base = editDraft.items.reduce((s, it) => s + itemPrice(it), 0);
  box.innerHTML = sur.length
    ? sur.map((s) => '<span class="chip">' + esc(s.label) + ' +' + fmtMoney(s.value) + ' zł</span>').join('') + '<span class="chip ok">Razem auto: ' + fmtMoney(base + auto) + ' zł</span>'
    : '<span class="chip"><span class="k">auto</span>brak dopłat</span>';
}

function analyzeImport() {
  const ta = $('#importText');
  const raw = ta ? ta.value : '';
  if (!raw.trim()) { toast('Wklej najpierw treść rozmowy.', 'warn'); return; }
  store.session = raw;
  const convs = splitConversations(raw);
  importParsed = convs.map((c) => parseChat(c.lines.join('\n'))).filter((p) => p.raw.trim().length > 0);
  const box = $('#importReview');
  if (box) {
    box.innerHTML = '<div class="sect-title">Rozpoznane rozmowy (' + importParsed.length + ')</div>' +
      importParsed.map(importResultCard).join('');
  }
  const btn = $('#importAddBtn');
  if (btn) btn.classList.remove('hidden');
  toast('Rozpoznano ' + importParsed.length + ' rozmów.', 'ok');
}
function addParsedImports() {
  const checks = $$('[data-import-check]');
  const chosen = checks.length ? checks.filter((c) => c.checked).map((c) => parseInt(c.getAttribute('data-import-check'), 10)) : importParsed.map((_, i) => i);
  if (!chosen.length) { toast('Zaznacz przynajmniej jedną rozmowę.', 'warn'); return; }
  pushUndo('import rozmów');
  let added = 0;
  chosen.forEach((i) => {
    const p = importParsed[i];
    if (!p) return;
    const o = orderFromParse(p, { status: 'new' });
    store.orders.push(o);
    if (p.client.name && p.client.nameConfident >= 0.8 && p.client.memKey) store.learn.names[p.client.memKey] = p.client.name;
    if (p.items && p.items.length && p.items[0].recipeId) learnRecipeWord(p.raw, p.items[0].recipeId);
    added++;
  });
  store.learn.accepted = (store.learn.accepted || 0) + added;
  saveAll(); closeModal(); renderAll();
  toast('Dodano ' + added + ' zamówień do tablicy.', 'ok', 3200, 'Cofnij');
}

function debounce(fn, ms) {

function openPalette() {
  const root = $('#paletteRoot');
  if (!root) return;
  root.innerHTML = '<div class="palette-back" data-action="palette-backdrop"><div class="palette" role="dialog" aria-modal="true">' +
    '<div class="palette-in"><span>⌘</span><input type="text" id="paletteInput" placeholder="Szukaj poleceń, widoków, zamówień…" autocomplete="off" spellcheck="false"></div>' +
    '<div class="palette-list" id="paletteList"></div></div></div>';
  paletteSel = 0;
  renderPalette('');
  const inp = $('#paletteInput'); if (inp) inp.focus();
}
function closePalette() { const root = $('#paletteRoot'); if (root) root.innerHTML = ''; }
function renderPalette(q) {
  const list = $('#paletteList');
  if (!list) return;
  const cmds = paletteCommands().filter((c) => !q || norm(c.title + ' ' + (c.sub || '')).includes(norm(q)));
  window.__paletteCmds = cmds;
  if (paletteSel >= cmds.length) paletteSel = Math.max(0, cmds.length - 1);
  list.innerHTML = cmds.length ? cmds.map((c, i) =>
    '<div class="pal-row' + (i === paletteSel ? ' sel' : '') + '" data-action="palette-run" data-i="' + i + '">' +
    '<span class="pi">' + c.ico + '</span><span class="pt"><b>' + esc(c.title) + '</b>' + (c.sub ? '<span>' + esc(c.sub) + '</span>' : '') + '</span><span class="pk">' + esc(c.tag || 'akcja') + '</span></div>'
  ).join('') : '<div class="pal-empty">Brak wyników dla „' + esc(q) + '”.</div>';
}
function runPalette(i) {
  const cmds = window.__paletteCmds || [];
  const c = cmds[i];
  if (!c) return;
  closePalette();
  try { c.run(); } catch (e) { toast('Nie udało się wykonać polecenia.', 'err'); }
}
function movePalette(delta) {
  const cmds = window.__paletteCmds || [];
  if (!cmds.length) return;
  paletteSel = (paletteSel + delta + cmds.length) % cmds.length;
  const list = $('#paletteList');
  if (list) {
    $$('.pal-row', list).forEach((r, i) => r.classList.toggle('sel', i === paletteSel));
    const sel = $('.pal-row.sel', list);
    if (sel && sel.scrollIntoView) sel.scrollIntoView({ block: 'nearest' });
  }
}

function commitEditor(mode) {
  syncEditorFromDOM();
  const order = normalizeOrder(deep(editDraft));
  order.updatedAt = new Date().toISOString();
  order.finance.surcharges = surchargesFor(order.items, order.logistics, order.logistics.dueAt);
  const auto = order.items.reduce((s, it) => s + itemPrice(it), 0) + sum(order.finance.surcharges, (s) => s.value);
  if (!order.finance.amount) order.finance.amount = auto;
  order.flags = {};

  if (mode === 'new') store.orders.unshift(order);
  else { const i = store.orders.findIndex((x) => x.id === order.id); if (i >= 0) store.orders[i] = order; else store.orders.unshift(order); }

  toast(mode === 'new' ? 'Dodano zamówienie.' : 'Zapisano zmiany.', 'ok');
}

/* ==================== 30. ZDARZENIA =================== */
function onClick(e) {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const a = el.getAttribute('data-action');
  if (a === 'goto') { e.preventDefault(); go(el.getAttribute('data-view')); return; }
  switch (a) {
    case 'toggle-nav': try { $('#sidebar').classList.toggle('open'); document.body.classList.toggle('nav-open', $('#sidebar').classList.contains('open')); } catch (x) { /* ignore */ } break;
    case 'close-nav': try { $('#sidebar').classList.remove('open'); document.body.classList.remove('nav-open'); } catch (x) { /* ignore */ } break;
    case 'modal-close': closeModal(); break;
    case 'modal-backdrop': if (e.target.classList.contains('modal-back')) closeModal(); break;
    case 'palette-backdrop': if (e.target.classList.contains('palette-back')) closePalette(); break;
    case 'palette-run': runPalette(parseInt(el.getAttribute('data-i'), 10)); break;
    case 'open-palette': openPalette(); break;
    case 'notif': openNotifs(); break;
    case 'toggle-theme': toggleTheme(); break;
    case 'quick-add': case 'new-order': openOrderEditor(); break;
    case 'play-import': openImport(); break;
    case 'edit-order': case 'open-order': openOrderEditor(el.getAttribute('data-id')); break;
    case 'deliver': openDeliver(el.getAttribute('data-id')); break;
    case 'print-order': printOrder(el.getAttribute('data-id')); break;
    case 'print-day': printDay(el.getAttribute('data-date')); break;
    case 'print-shopping': printShopping(); break;
    case 'dup-order': duplicateOrder(el.getAttribute('data-id')); break;
    case 'del-order': deleteOrder(el.getAttribute('data-id')); break;
    case 'mark-paid': markPaid(el.getAttribute('data-id')); break;
    case 'toggle-recipe': toggleRecipeOpen(el.getAttribute('data-id')); break;
    case 'filter': { const k = el.getAttribute('data-key'), v = el.getAttribute('data-value'); if (k === 'shopRange') { store.shopRange = v; renderView('zakupy'); } else { store.filters[k] = v; renderView('tablica'); } break; }
    case 'recipe-size': store.recipeSize = store.recipeSize || {}; store.recipeSize[el.getAttribute('data-recipe')] = el.getAttribute('data-size'); renderView('receptury'); break;
    case 'plan-day': { const d = addDays(planSelected(), parseInt(el.getAttribute('data-delta'), 10)); store.calSelected = toDateInput(d.toISOString()); renderView('plan'); break; }
    case 'plan-today': store.calSelected = toDateInput(new Date().toISOString()); renderView('plan'); break;
    case 'plan-open': store.calSelected = el.getAttribute('data-date'); go('plan'); break;
    case 'cal-month': { const nm = new Date(store.calMonth); nm.setMonth(nm.getMonth() + parseInt(el.getAttribute('data-delta'), 10)); store.calMonth = startOfMonth(nm); renderView('kalendarz'); break; }
    case 'cal-today': store.calMonth = startOfMonth(new Date()); store.calSelected = toDateInput(new Date().toISOString()); renderView('kalendarz'); break;
    case 'cal-select': store.calSelected = el.getAttribute('data-date'); renderView('kalendarz'); break;
    case 'open-client': openClientProfile(el.getAttribute('data-key')); break;
    case 'message': { const c = clientProfiles().find((x) => x.key === el.getAttribute('data-key')); const o = c && (c.upcoming || (c.orders[0])); if (o) openTemplateGenerator(o.id); else openTemplateGenerator(); break; }
    case 'client-save': saveClientNote(el.getAttribute('data-key'), (($('#clientNote') || {}).value || ''), (($('#clientTags') || {}).value || '').split(',').map((s) => s.trim()).filter(Boolean)); closeModal(); renderAll(); toast('Zapisano notatkę.', 'ok'); break;
    case 'client-message': { const c = clientProfiles().find((x) => x.key === el.getAttribute('data-key')); const o = c && (c.upcoming || (c.orders[0])); closeModal(); if (o) openTemplateGenerator(o.id); else openTemplateGenerator(); break; }
    case 'set-accent': store.settings.ui.accent = el.getAttribute('data-value'); applySettings(); saveAll(); renderView('ustawienia'); break;
    case 'export-json': exportJSON(); break;
    case 'export-csv': exportCSV(); break;
    case 'export-clients': exportClientsCSV(); break;
    case 'csv-shopping': csvShopping(); break;
    case 'demo': loadDemo(); break;
    case 'clear-data': clearData(); break;
    case 'snapshot': snapshot('ręczna kopia'); toast('Zapisano kopię.', 'ok'); if (store.view === 'ustawienia') renderView('ustawienia'); break;
    case 'restore-snapshot': if (confirm('Przywrócić tę kopię? Bieżące dane zostaną nadpisane.')) restoreSnapshot(parseInt(el.getAttribute('data-idx'), 10)); break;
    case 'reset-learn': store.learn = { names: {}, words: {}, accepted: 0 }; saveAll(); renderView('ustawienia'); toast('Pamięć silnika wyczyszczona.', 'ok'); break;
    case 'buy-toggle': break;
    case 'clear-bought': store.shopping.bought[shoppingBoughtKey(store.shopRange || 'planned')] = {}; saveAll(); renderView('zakupy'); break;
    case 'pantry-add': pantryAdd(); break;
    case 'pantry-del': store.pantry.splice(parseInt(el.getAttribute('data-idx'), 10), 1); saveAll(); renderView('zakupy'); break;
    case 'manual-add': manualAdd(); break;
    case 'manual-del': store.shopping.manual.splice(parseInt(el.getAttribute('data-idx'), 10), 1); saveAll(); renderView('zakupy'); break;
    case 'import-example': { const ta = $('#importText'); if (ta) ta.value = chatExample(); break; }
    case 'import-file': pickTextFile(); break;
    case 'import-analyze': analyzeImport(); break;
    case 'import-add': addParsedImports(); break;
    case 'order-item-add': syncEditorFromDOM(); editDraft.items.push({ recipeId: 'sernik', sizeId: 's20', qty: 1, personal: [], allergens: [], notes: '' }); renderOrderEditor(currentEditorMode()); break;
    case 'order-item-del': syncEditorFromDOM(); editDraft.items.splice(parseInt(el.getAttribute('data-idx'), 10), 1); if (!editDraft.items.length) editDraft.items.push({ recipeId: 'sernik', sizeId: 's20', qty: 1, personal: [], allergens: [], notes: '' }); renderOrderEditor(currentEditorMode()); break;
    case 'order-save': commitEditor(el.getAttribute('data-mode')); break;
    case 'order-del-in-editor': deleteOrder(el.getAttribute('data-id')); break;
    case 'copy-message': { const ta = $('#deliverMsg'); copyText(ta ? ta.value : '').then((ok) => toast(ok ? 'Skopiowano wiadomość.' : 'Skopiuj ręcznie.', ok ? 'ok' : 'warn')); break; }
    case 'copy-text': { const t = $('#' + el.getAttribute('data-target')); copyText(t ? t.value : '').then((ok) => toast(ok ? 'Skopiowano.' : 'Skopiuj ręcznie.', ok ? 'ok' : 'warn')); break; }
    case 'deliver-status': { const id = el.getAttribute('data-id'); setOrderStatus(id, el.getAttribute('data-status')); openDeliver(id); break; }
    case 'deliver-paid': { const id = el.getAttribute('data-id'); const o = findOrder(id); if (o) { o.finance.paid = true; o.finance.deposit = orderTotal(o); saveAll(); renderView(store.view); } openDeliver(id); break; }
    case 'tpl-reset': { store.msgTpl = 'gotowe'; openTemplateGenerator(store.__tplOrderId); break; }
    default: break;
  }
}
function onChange(e) {
  const el = e.target;
  if (el.matches && el.matches('select[data-action="set-status"]')) { setOrderStatus(el.getAttribute('data-id'), el.value); return; }
  if (el.id === 'planDate') { store.calSelected = el.value; renderView('plan'); return; }
  if (el.id === 'tplPick') { store.msgTpl = el.value; const ta = $('#tplText'); const o = store.__tplOrderId ? findOrder(store.__tplOrderId) : null; const vars = o ? templateVars(o) : { imie: 'Kliencie', wypiek: '', wielkosc: '', data: '', kwota: '', logistyka: store.settings.bakery.pickupNote, cukiernia: store.settings.bakery.name, kamila: store.settings.bakery.owner }; if (ta) ta.value = fillTemplate(getTemplate(el.value).text, vars); return; }
  if (el.id === 'importFile') { const f = el.files && el.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => importJSON(String(r.result || '')); r.readAsText(f, 'utf-8'); return; }
  if (el.hasAttribute && el.hasAttribute('data-path')) {
    let v = el.type === 'checkbox' ? el.checked : (el.type === 'number' ? (el.value === '' ? 0 : Number(el.value)) : el.value);
    const path = el.getAttribute('data-path');
    saveSettingsPath(path, v);
    applySettings(); saveAll();
    if (path.indexOf('ui.') !== 0 && store.view === 'ustawienia') renderView('ustawienia');
    return;
  }
  if (el.hasAttribute && el.hasAttribute('data-action') && el.getAttribute('data-action') === 'buy-toggle') {
    const range = store.shopRange || 'planned';
    const k = shoppingBoughtKey(range);
    store.shopping.bought[k] = store.shopping.bought[k] || {};
    if (el.checked) store.shopping.bought[k][el.getAttribute('data-key')] = true;
    else delete store.shopping.bought[k][el.getAttribute('data-key')];
    saveAll(); return;
  }
  if (el.hasAttribute && el.hasAttribute('data-ifield')) {
    syncEditorFromDOM();
    const f = el.getAttribute('data-ifield');
    if (f === 'recipeId') { const i = parseInt(el.getAttribute('data-item'), 10); const it = editDraft.items[i]; if (it) { const r = getRecipe(it.recipeId); if (r && !r.sizes.some((s) => s.id === it.sizeId)) it.sizeId = baseSize(r).id; } renderOrderEditor(currentEditorMode()); }
    else updateSurchargePreview();
    return;
  }
  if (el.hasAttribute && (el.hasAttribute('data-field'))) { syncEditorFromDOM(); updateSurchargePreview(); return; }
}
const searchDebounced = debounce((which, value) => {
  if (which === 'board') { store.filters.q = value; renderView('tablica'); const i = $('#boardSearch'); if (i) { i.focus(); try { i.setSelectionRange(i.value.length, i.value.length); } catch (e) { /* ignore */ } } }
  else if (which === 'client') { store.clientQuery = value; renderView('klienci'); const i = $('#clientSearch'); if (i) { i.focus(); try { i.setSelectionRange(i.value.length, i.value.length); } catch (e) { /* ignore */ } } }
}, 220);
function onInput(e) {
  const el = e.target;
  if (el.id === 'boardSearch') { searchDebounced('board', el.value); return; }
  if (el.id === 'clientSearch') { searchDebounced('client', el.value); return; }
  if (el.id === 'paletteInput') { paletteSel = 0; renderPalette(el.value); return; }
  if (el.id === 'importText') { store.session = el.value; return; }
}
function onKey(e) {
  const mod = e.ctrlKey || e.metaKey;
  if (mod && (e.key === 'k' || e.key === 'K')) { e.preventDefault(); const isOpen = $('#paletteInput'); if (isOpen) closePalette(); else openPalette(); return; }
  if (mod && (e.key === 'z' || e.key === 'Z')) { if (!/INPUT|TEXTAREA|SELECT/.test((e.target.tagName || ''))) { e.preventDefault(); undoLast(); } return; }
  if (e.key === 'Escape') { if ($('#paletteInput')) { closePalette(); return; } if ($('#modalRoot') && $('#modalRoot').innerHTML) { closeModal(); return; } }
  if ($('#paletteInput')) {
    if (e.key === 'ArrowDown') { e.preventDefault(); movePalette(1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); movePalette(-1); }
    else if (e.key === 'Enter') { e.preventDefault(); runPalette(paletteSel); }
  }
}
function onDragStart(e) {
  const card = e.target.closest ? e.target.closest('.card[data-id]') : null;
  if (!card) return;
  store.draggingId = card.getAttribute('data-id');
  card.classList.add('dragging');
  try { e.dataTransfer.setData('text/plain', store.draggingId); e.dataTransfer.effectAllowed = 'move'; } catch (x) { /* ignore */ }
}
function onDragOver(e) {
  const col = e.target.closest ? e.target.closest('.column[data-drop]') : null;
  if (!col) return;
  e.preventDefault();
  $$('.column.drag-over').forEach((c) => { if (c !== col) c.classList.remove('drag-over'); });
  col.classList.add('drag-over');
}
function onDrop(e) {
  const col = e.target.closest ? e.target.closest('.column[data-drop]') : null;
  if (!col) return;
  e.preventDefault();
  let id = store.draggingId;
  try { if (!id) id = e.dataTransfer.getData('text/plain'); } catch (x) { /* ignore */ }
  $$('.column.drag-over').forEach((c) => c.classList.remove('drag-over'));
  const status = col.getAttribute('data-drop');
  if (id) setOrderStatus(id, status);
  store.draggingId = null;
}
function onDragEnd() {
  $$('.card.dragging').forEach((c) => c.classList.remove('dragging'));
  $$('.column.drag-over').forEach((c) => c.classList.remove('drag-over'));
}
function bindEvents() {
  document.addEventListener('click', onClick);
  document.addEventListener('change', onChange);
  document.addEventListener('input', onInput);
  document.addEventListener('keydown', onKey);
  document.addEventListener('dragstart', onDragStart);
  document.addEventListener('dragover', onDragOver);
  document.addEventListener('drop', onDrop);
  document.addEventListener('dragend', onDragEnd);
  window.addEventListener('hashchange', () => {
    const v = (location.hash || '').replace(/^#\/?/, '');
    if (VIEWS[v]) renderView(v);
  });
  window.addEventListener('resize', debounce(() => { const def = VIEWS[store.view]; if (def && def.post) { try { def.post(); } catch (e) { /* ignore */ } } }, 260));
}

/* ==================== 31. START =================== */
function init() {
  loadAll();
  applySettings();
  let v = 'pulpit';
  try { const h = (location.hash || '').replace(/^#\/?/, ''); if (VIEWS[h]) v = h; } catch (e) { /* ignore */ }
  store.view = v;
  store.calSelected = toDateInput(new Date().toISOString());
  renderAll();
  bindEvents();
  if (!store.orders.length) {
    setTimeout(() => toast('Witaj w Domowej Cukierni Kamili! Wklej czat z Messengera lub wczytaj przykład.', 'info', 6000), 600);
  }
  setInterval(() => {
    const ae = document.activeElement;
    if (ae && /INPUT|TEXTAREA|SELECT/.test(ae.tagName || '')) return;
    if (store.view === 'tablica' || store.view === 'pulpit' || store.view === 'plan') renderView(store.view);
  }, 60000);
}
init();
</script>
