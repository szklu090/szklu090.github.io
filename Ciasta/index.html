<!DOCTYPE html>
<html lang="pl" data-theme="light" data-contrast="normal" data-accent="rose" data-density="cozy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Domowa Cukiernia Kamili — Studio Zamówień</title>
<meta name="description" content="Kompletny system operacyjny Domowej Cukierni Kamili: silnik NLP rozmów, receptury z kosztorysem, planowanie wsteczne produkcji, CRM klientów, finanse, lista zakupów i centrum wiadomości.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='78' font-size='80'%3E%F0%9F%A7%81%3C/text%3E%3C/svg%3E">
<style>
/* ==========================================================================
   DOMOWA CUKIERNIA KAMILI — STUDIO ZAMÓWIEŃ
   Design system "Pastel Atelier" · wersja 2.0
   ========================================================================== */
:root{
  --bg:#fbf7f4;
  --bg-grad:
    radial-gradient(1400px 700px at 4% -14%, #fdeae6 0%, transparent 60%),
    radial-gradient(1100px 560px at 104% -6%, #f6e6f2 0%, transparent 56%),
    radial-gradient(900px 700px at 60% 120%, #f2efe4 0%, transparent 60%),
    linear-gradient(180deg,#fdfaf7 0%, #fbf7f4 100%);
  --surface:#fffdfc;
  --surface-2:#fdf5f1;
  --surface-3:#f8ebe4;
  --surface-4:#f3e2d9;
  --text:#3a2823;
  --text-soft:#6d544b;
  --muted:#9c837a;
  --line:#efdfd8;
  --line-strong:#e2cbc2;

  --cream:#fff9f4;
  --espresso:#31201a;
  --pink:#f5cfd5;
  --pink-strong:#d98a94;
  --beige:#ebd8c8;
  --accent:#c8765e;
  --accent-2:#a95a44;
  --accent-soft:#fbe9e2;
  --on-accent:#fff;

  --blue:#4f83c9;   --blue-bg:#eaf1fb;   --blue-line:#c8daf2;
  --orange:#cf7a24; --orange-bg:#fdf0de; --orange-line:#f4dab1;
  --red:#c2453c;    --red-bg:#fbe9e7;    --red-line:#f2cdc9;
  --green:#47895f;  --green-bg:#e9f4ec;  --green-line:#c6e1cf;
  --violet:#7d63c9; --violet-bg:#efeafa; --violet-line:#d8cef2;
  --yellow:#b8890f; --yellow-bg:#fdf5d8; --yellow-line:#eedfa0;

  --shadow-xs:0 1px 2px rgba(58,36,28,.05);
  --shadow-sm:0 1px 2px rgba(58,36,28,.05), 0 3px 10px rgba(58,36,28,.05);
  --shadow:0 2px 6px rgba(58,36,28,.06), 0 14px 32px rgba(58,36,28,.08);
  --shadow-lg:0 10px 24px rgba(58,36,28,.12), 0 40px 90px rgba(58,36,28,.18);
  --radius:18px; --radius-sm:12px; --radius-xs:9px;
  --sidebar:260px;
  --font:-apple-system, BlinkMacSystemFont, "Segoe UI Variable Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono:"Cascadia Mono", Consolas, "SFMono-Regular", "Roboto Mono", monospace;
}
/* --- Palety akcentu --- */
html[data-accent="rose"]  { --accent:#c8765e; --accent-2:#a95a44; --accent-soft:#fbe9e2; --pink:#f5cfd5; --pink-strong:#d98a94; }
html[data-accent="mint"]  { --accent:#4e9b7d; --accent-2:#3c7d64; --accent-soft:#e6f4ee; --pink:#cfe8dd; --pink-strong:#6fb19a; }
html[data-accent="lilac"] { --accent:#8a6fc4; --accent-2:#6f57a8; --accent-soft:#efeafa; --pink:#ddd3f0; --pink-strong:#a08cd6; }
html[data-accent="caramel"]{ --accent:#a97434; --accent-2:#8b5c26; --accent-soft:#f8eddc; --pink:#ecd9c0; --pink-strong:#c49a5f; }
html[data-accent="berry"] { --accent:#b4527c; --accent-2:#933f66; --accent-soft:#fae7ef; --pink:#f2c9da; --pink-strong:#d385a6; }

html[data-theme="dark"]{
  --bg:#1b1412;
  --bg-grad:
    radial-gradient(1300px 640px at 2% -14%, #34211d 0%, transparent 58%),
    radial-gradient(1000px 540px at 104% -6%, #2c1f2b 0%, transparent 54%),
    linear-gradient(180deg,#211815 0%, #1b1412 100%);
  --surface:#271d1a;
  --surface-2:#2f231f;
  --surface-3:#382a24;
  --surface-4:#42312a;
  --text:#f7ece5;
  --text-soft:#d9c6bb;
  --muted:#a98f83;
  --line:#3b2b25;
  --line-strong:#553f36;
  --cream:#2a1f1b;
  --espresso:#140e0c;
  --accent-soft:#3d2924;
  --on-accent:#1b1412;

  --blue:#8fbaf0;   --blue-bg:#1d2b3d;   --blue-line:#2f4a68;
  --orange:#f0b46a; --orange-bg:#35251a; --orange-line:#5d4227;
  --red:#f2887f;    --red-bg:#3a1f1d;    --red-line:#5c3a36;
  --green:#8fd0a5;  --green-bg:#1b2e23;  --green-line:#2e4b38;
  --violet:#b9a6f0; --violet-bg:#282045; --violet-line:#42376b;
  --yellow:#e8cc72; --yellow-bg:#332c16; --yellow-line:#5a4d24;
  --shadow-xs:0 1px 2px rgba(0,0,0,.4);
  --shadow-sm:0 1px 2px rgba(0,0,0,.4), 0 3px 10px rgba(0,0,0,.35);
  --shadow:0 2px 6px rgba(0,0,0,.45), 0 14px 32px rgba(0,0,0,.45);
  --shadow-lg:0 10px 24px rgba(0,0,0,.55), 0 40px 90px rgba(0,0,0,.65);
}
html[data-contrast="high"]{
  --bg:#fff; --bg-grad:linear-gradient(#fff,#fff);
  --surface:#fff; --surface-2:#fff; --surface-3:#f4f4f4; --surface-4:#e9e9e9;
  --text:#000; --text-soft:#141414; --muted:#2e2e2e; --line:#000; --line-strong:#000;
  --accent:#8a2f14; --accent-2:#5e1f0c; --accent-soft:#ffe9e2; --on-accent:#fff;
  --blue:#00429b;   --blue-bg:#e3edff;   --blue-line:#00429b;
  --orange:#8a4b00; --orange-bg:#fff2df; --orange-line:#8a4b00;
  --red:#9b0000;    --red-bg:#ffe6e6;    --red-line:#9b0000;
  --green:#005c22;  --green-bg:#e3ffe9;  --green-line:#005c22;
  --violet:#3b1e9b; --violet-bg:#ece7ff; --violet-line:#3b1e9b;
  --yellow:#6b5200; --yellow-bg:#fff8d6; --yellow-line:#6b5200;
  --shadow-xs:none; --shadow-sm:none; --shadow:none; --shadow-lg:none;
}
html[data-contrast="high"][data-theme="dark"]{
  --bg:#000; --bg-grad:linear-gradient(#000,#000);
  --surface:#000; --surface-2:#000; --surface-3:#0d0d0d; --surface-4:#161616;
  --text:#fff; --text-soft:#efefef; --muted:#c9c9c9; --line:#fff; --line-strong:#fff;
  --accent:#ffb08a; --accent-2:#ffc7ab; --accent-soft:#3a1e15; --on-accent:#000;
  --blue:#8fc4ff;   --blue-bg:#001a33;   --blue-line:#8fc4ff;
  --orange:#ffb865; --orange-bg:#2a1800; --orange-line:#ffb865;
  --red:#ff8a8a;    --red-bg:#2a0000;    --red-line:#ff8a8a;
  --green:#7dffa6;  --green-bg:#00260f;  --green-line:#7dffa6;
  --violet:#c3b0ff; --violet-bg:#140a33; --violet-line:#c3b0ff;
  --yellow:#ffe066; --yellow-bg:#241f00; --yellow-line:#ffe066;
}
html[data-density="compact"]{ --radius:12px; --radius-sm:9px; --radius-xs:7px; }
html[data-density="compact"] .card-inner{ padding:10px 11px 10px 13px; gap:8px; }
html[data-density="compact"] .panel-body{ padding:12px 14px; }

*,*::before,*::after{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }
body{
  font-family:var(--font); color:var(--text);
  background:var(--bg); background-image:var(--bg-grad); background-attachment:fixed;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  line-height:1.5; min-height:100vh; overflow-x:hidden;
}
h1,h2,h3,h4,h5{ margin:0; font-weight:750; letter-spacing:-.02em; line-height:1.22; }
button,input,select,textarea{ font:inherit; color:inherit; }
button{ cursor:pointer; }
a{ color:var(--accent-2); }
::selection{ background:var(--pink); color:var(--espresso); }
*::-webkit-scrollbar{ width:11px; height:11px; }
*::-webkit-scrollbar-track{ background:transparent; }
*::-webkit-scrollbar-thumb{ background:var(--line-strong); border-radius:99px; border:3px solid transparent; background-clip:content-box; }
*::-webkit-scrollbar-thumb:hover{ background:var(--muted); background-clip:content-box; }
.hidden{ display:none !important; }
.muted{ color:var(--muted); }
.small{ font-size:12.5px; }
.tiny{ font-size:11.5px; }
.center{ text-align:center; }
.nowrap{ white-space:nowrap; }
.mono{ font-family:var(--mono); }
.full{ grid-column:1/-1; }
.grow{ flex:1 1 auto; }
.row{ display:flex; align-items:center; gap:9px; flex-wrap:wrap; }
.row.tight{ gap:6px; }
.col{ display:flex; flex-direction:column; gap:9px; }
.spread{ display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }

/* ============================== LAYOUT ============================== */
.app{ display:flex; min-height:100vh; }
.sidebar{
  width:var(--sidebar); flex:0 0 var(--sidebar);
  position:sticky; top:0; height:100vh; z-index:70;
  display:flex; flex-direction:column; gap:6px;
  padding:16px 14px;
  background:color-mix(in srgb, var(--surface) 90%, transparent);
  border-right:1px solid var(--line);
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
}
html[data-contrast="high"] .sidebar{ background:var(--surface); backdrop-filter:none; }
.side-brand{ display:flex; align-items:center; gap:11px; padding:6px 6px 14px; }
.side-logo{
  width:46px; height:46px; flex:0 0 46px; border-radius:15px; display:grid; place-items:center; font-size:24px;
  background:linear-gradient(150deg,var(--pink),var(--beige)); border:1px solid var(--line-strong); box-shadow:var(--shadow-sm);
}
html[data-contrast="high"] .side-logo{ background:var(--surface); }
.side-logo-txt{ min-width:0; }
.side-logo-txt b{ display:block; font-size:14.5px; letter-spacing:-.03em; line-height:1.15; }
.side-logo-txt span{ display:block; font-size:10.5px; color:var(--muted); letter-spacing:.06em; text-transform:uppercase; font-weight:750; }
.nav{ display:flex; flex-direction:column; gap:3px; overflow-y:auto; flex:1 1 auto; }
.nav a{
  display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:11px;
  text-decoration:none; color:var(--text-soft); font-size:13.5px; font-weight:650;
  transition:background .14s, color .14s, transform .14s;
}
.nav a .ni{ font-size:16px; width:20px; text-align:center; flex:0 0 20px; }
.nav a .badge-mini{
  margin-left:auto; font-size:10.5px; font-weight:800; padding:1px 7px; border-radius:99px;
  background:var(--surface-3); color:var(--text-soft); border:1px solid var(--line);
}
.nav a:hover{ background:var(--surface-2); color:var(--text); }
.nav a.active{ background:var(--accent-soft); color:var(--accent-2); font-weight:800; }
.nav a.active .badge-mini{ background:var(--accent); color:var(--on-accent); border-color:transparent; }
html[data-contrast="high"] .nav a.active{ background:var(--accent); color:var(--on-accent); }
.nav-sep{ height:1px; background:var(--line); margin:9px 6px; }
.side-foot{ padding-top:8px; border-top:1px solid var(--line); display:flex; flex-direction:column; gap:6px; }
.side-foot .tiny{ color:var(--muted); padding:0 6px; }

.main{ flex:1 1 auto; min-width:0; display:flex; flex-direction:column; }
.topbar{
  position:sticky; top:0; z-index:60; display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  padding:12px clamp(14px,2.2vw,28px);
  background:color-mix(in srgb, var(--surface) 84%, transparent);
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(14px) saturate(1.5); -webkit-backdrop-filter:blur(14px) saturate(1.5);
}
html[data-contrast="high"] .topbar{ background:var(--surface); backdrop-filter:none; }
.page-title{ min-width:0; }
.page-title h1{ font-size:19px; letter-spacing:-.03em; }
.page-title .crumb{ font-size:11.5px; color:var(--muted); font-weight:650; }
.hamb{ display:none; }
.view{ padding:clamp(14px,2.2vw,26px); padding-bottom:110px; max-width:1720px; width:100%; margin:0 auto; }
.scrim{ display:none; }

@media (max-width:1040px){
  .sidebar{ position:fixed; left:0; top:0; transform:translateX(-104%); transition:transform .22s cubic-bezier(.2,.9,.3,1); box-shadow:var(--shadow-lg); width:min(84vw,300px); flex-basis:auto; }
  .sidebar.open{ transform:none; }
  .hamb{ display:inline-flex; }
  body.nav-open .scrim{ display:block; position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:65; }
}

/* ============================== PRZYCISKI ============================== */
.btn{
  --btn-bg:var(--surface-2); --btn-fg:var(--text); --btn-bd:var(--line-strong);
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
  padding:9px 14px; border-radius:11px; border:1px solid var(--btn-bd);
  background:var(--btn-bg); color:var(--btn-fg); font-size:13.5px; font-weight:650; line-height:1.2;
  box-shadow:var(--shadow-xs); white-space:nowrap; text-decoration:none;
  transition:transform .12s ease, box-shadow .16s ease, background .16s, border-color .16s, color .16s;
}
.btn:hover{ transform:translateY(-1px); box-shadow:var(--shadow-sm); }
.btn:active{ transform:translateY(0) scale(.985); }
.btn:focus-visible{ outline:3px solid color-mix(in srgb, var(--blue) 55%, transparent); outline-offset:2px; }
.btn[disabled]{ opacity:.45; pointer-events:none; }
.btn .ico{ font-size:15px; line-height:1; }
.btn-primary{ --btn-bg:linear-gradient(160deg,var(--accent),var(--accent-2)); --btn-fg:var(--on-accent); --btn-bd:transparent; }
html[data-contrast="high"] .btn-primary{ --btn-bg:var(--accent); --btn-fg:var(--on-accent); --btn-bd:#000; }
html[data-contrast="high"][data-theme="dark"] .btn-primary{ --btn-bd:#fff; }
.btn-espresso{ --btn-bg:var(--espresso); --btn-fg:var(--cream); --btn-bd:transparent; }
html[data-theme="dark"] .btn-espresso{ --btn-bg:var(--surface-3); --btn-fg:var(--text); --btn-bd:var(--line-strong); }
.btn-blue{ --btn-bg:var(--blue-bg); --btn-fg:var(--blue); --btn-bd:var(--blue-line); }
.btn-green{ --btn-bg:var(--green-bg); --btn-fg:var(--green); --btn-bd:var(--green-line); }
.btn-orange{ --btn-bg:var(--orange-bg); --btn-fg:var(--orange); --btn-bd:var(--orange-line); }
.btn-violet{ --btn-bg:var(--violet-bg); --btn-fg:var(--violet); --btn-bd:var(--violet-line); }
.btn-danger{ --btn-bg:var(--red-bg); --btn-fg:var(--red); --btn-bd:var(--red-line); }
.btn-ghost{ --btn-bg:transparent; --btn-bd:var(--line); box-shadow:none; color:var(--text-soft); }
.btn-ghost:hover{ --btn-bg:var(--surface-2); }
.btn-xs{ padding:5px 9px; font-size:11.5px; border-radius:8px; }
.btn-sm{ padding:6px 11px; font-size:12.5px; border-radius:9px; }
.btn-lg{ padding:13px 20px; font-size:15px; border-radius:13px; }
.btn-block{ width:100%; }
.btn-icon{ padding:9px; width:40px; height:40px; }
.linkbtn{ border:0; background:transparent; color:var(--muted); font-size:12px; font-weight:700; padding:6px 8px; border-radius:8px; }
.linkbtn:hover{ background:var(--surface-3); color:var(--text); }
.linkbtn.danger:hover{ background:var(--red-bg); color:var(--red); }
.iconbtn{
  position:relative; width:40px; height:40px; border-radius:11px; display:grid; place-items:center;
  border:1px solid var(--line); background:var(--surface-2); font-size:17px; box-shadow:var(--shadow-xs);
}
.iconbtn:hover{ background:var(--surface-3); }
.iconbtn .dot{
  position:absolute; top:5px; right:5px; min-width:16px; height:16px; padding:0 4px; border-radius:99px;
  background:var(--red); color:#fff; font-size:9.5px; font-weight:800; display:grid; place-items:center; border:2px solid var(--surface);
}

/* ============================== PANELE ============================== */
.panel{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow-sm); overflow:hidden; }
.panel-head{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding:14px 18px; border-bottom:1px solid var(--line); background:linear-gradient(180deg,var(--surface-2),transparent); }
.panel-head h2,.panel-head h3{ font-size:15px; }
.panel-head .sub{ font-size:12.5px; color:var(--muted); font-weight:550; }
.panel-body{ padding:16px 18px; }
.panel-body.tight{ padding:12px 14px; }
.grid{ display:grid; gap:14px; }
.g2{ grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); }
.g3{ grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); }
.g4{ grid-template-columns:repeat(auto-fit,minmax(196px,1fr)); }
.stack{ display:flex; flex-direction:column; gap:14px; }

.stat{ position:relative; overflow:hidden; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px; box-shadow:var(--shadow-sm); transition:transform .16s, box-shadow .16s; }
.stat:hover{ transform:translateY(-2px); box-shadow:var(--shadow); }
.stat::after{ content:""; position:absolute; inset:auto -32px -44px auto; width:118px; height:118px; border-radius:50%; background:var(--tint,var(--pink)); opacity:.3; }
html[data-contrast="high"] .stat::after{ display:none; }
.stat-label{ font-size:11px; text-transform:uppercase; letter-spacing:.07em; font-weight:800; color:var(--muted); }
.stat-value{ font-size:29px; font-weight:850; letter-spacing:-.04em; margin-top:5px; font-variant-numeric:tabular-nums; }
.stat-value small{ font-size:14px; font-weight:750; color:var(--text-soft); margin-left:3px; }
.stat-foot{ font-size:12px; color:var(--text-soft); margin-top:3px; font-weight:550; }
.stat .stat-ico{ position:absolute; top:12px; right:14px; font-size:20px; opacity:.5; }
.stat.clickable{ cursor:pointer; }

.kpi-trend{ font-size:11.5px; font-weight:800; padding:2px 7px; border-radius:99px; }
.kpi-trend.up{ background:var(--green-bg); color:var(--green); }
.kpi-trend.down{ background:var(--red-bg); color:var(--red); }
.kpi-trend.flat{ background:var(--surface-3); color:var(--muted); }

/* ============================== CHIPY / TAGI ============================== */
.chips{ display:flex; flex-wrap:wrap; gap:7px; }
.chip{ display:inline-flex; align-items:center; gap:6px; padding:6px 11px; border-radius:99px; font-size:12.5px; font-weight:650; background:var(--surface); border:1px solid var(--line-strong); box-shadow:var(--shadow-xs); max-width:100%; }
.chip .k{ color:var(--muted); font-weight:800; text-transform:uppercase; font-size:10px; letter-spacing:.06em; }
.chip.ok{ background:var(--green-bg); border-color:var(--green-line); color:var(--green); }
.chip.warn{ background:var(--yellow-bg); border-color:var(--yellow-line); color:var(--yellow); }
.chip.bad{ background:var(--red-bg); border-color:var(--red-line); color:var(--red); }
.chip.info{ background:var(--blue-bg); border-color:var(--blue-line); color:var(--blue); }
.chip.cake{ background:var(--surface-3); border-color:var(--line-strong); color:var(--text); }
.chip.violet{ background:var(--violet-bg); border-color:var(--violet-line); color:var(--violet); }
.tag{ font-size:11.5px; font-weight:700; padding:3px 9px; border-radius:99px; background:var(--surface-3); border:1px solid var(--line); color:var(--text-soft); }
.tag.allergen{ background:var(--red-bg); border-color:var(--red-line); color:var(--red); }
.tag.personal{ background:var(--pink); border-color:var(--pink-strong); color:var(--espresso); }
html[data-theme="dark"] .tag.personal{ color:var(--text); }
.tag.diet{ background:var(--green-bg); border-color:var(--green-line); color:var(--green); }
.flag{ display:inline-flex; align-items:center; gap:5px; font-size:10.5px; font-weight:800; background:var(--yellow-bg); color:var(--yellow); border:1px solid var(--yellow-line); padding:2px 8px; border-radius:99px; text-transform:uppercase; letter-spacing:.04em; }
.flag.red{ background:var(--red-bg); color:var(--red); border-color:var(--red-line); }
.flag.green{ background:var(--green-bg); color:var(--green); border-color:var(--green-line); }

/* Pasek pewności NLP */
.conf{ display:inline-flex; align-items:center; gap:6px; font-size:10.5px; font-weight:800; color:var(--muted); }
.conf-bar{ width:46px; height:5px; border-radius:99px; background:var(--surface-4); overflow:hidden; }
.conf-bar i{ display:block; height:100%; border-radius:99px; background:var(--green); }
.conf-bar i.w{ background:var(--yellow); }
.conf-bar i.b{ background:var(--red); }

/* ============================== FORMULARZE ============================== */
.form-grid{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:13px; }
@media (max-width:700px){ .form-grid{ grid-template-columns:1fr; } }
.field{ display:flex; flex-direction:column; gap:5px; min-width:0; }
.field label{ font-size:11.5px; font-weight:800; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); display:flex; align-items:center; gap:7px; }
.field input[type=text],.field input[type=number],.field input[type=tel],.field input[type=email],.field input[type=url],
.field input[type=date],.field input[type=time],.field input[type=datetime-local],.field select,.field textarea{
  padding:10px 12px; border-radius:11px; border:1.5px solid var(--line); background:var(--surface-2); outline:none; font-size:14px; width:100%;
  transition:border-color .15s, box-shadow .15s, background .15s;
}
.field textarea{ min-height:78px; resize:vertical; }
.field select{ appearance:none; background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%); background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%; background-size:5px 5px,5px 5px; background-repeat:no-repeat; padding-right:34px; }
.field input:focus,.field select:focus,.field textarea:focus{ border-color:var(--accent); background:var(--surface); box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 15%,transparent); }
.field.needs-confirm input,.field.needs-confirm select,.field.needs-confirm textarea{ background:var(--yellow-bg); border-color:var(--yellow); }
.field .hint{ font-size:11.5px; color:var(--muted); }
.field.inline{ flex-direction:row; align-items:center; gap:9px; }
.radio-row{ display:flex; gap:8px; flex-wrap:wrap; }
.radio-row label{ display:flex; align-items:center; gap:7px; padding:9px 13px; border-radius:11px; border:1.5px solid var(--line); background:var(--surface-2); font-size:13px; font-weight:700; text-transform:none; letter-spacing:0; color:var(--text); cursor:pointer; }
.radio-row input{ accent-color:var(--accent); }
.radio-row label:has(input:checked){ border-color:var(--accent); background:var(--accent-soft); }
.switch{ display:flex; align-items:center; gap:9px; font-size:13px; font-weight:650; }
.switch input{ width:18px; height:18px; accent-color:var(--accent); }
.seg{ display:inline-flex; background:var(--surface-2); border:1px solid var(--line); border-radius:11px; padding:3px; gap:2px; flex-wrap:wrap; }
.seg button{ border:0; background:transparent; padding:7px 12px; border-radius:8px; font-size:12.5px; font-weight:650; color:var(--text-soft); white-space:nowrap; }
.seg button[aria-pressed="true"]{ background:var(--surface); color:var(--text); box-shadow:var(--shadow-xs); }
html[data-contrast="high"] .seg button[aria-pressed="true"]{ background:var(--accent); color:var(--on-accent); }
.search{ display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--line); border-radius:11px; padding:8px 12px; box-shadow:var(--shadow-xs); min-width:200px; flex:1 1 200px; max-width:360px; }
.search input{ border:0; background:transparent; outline:none; width:100%; font-size:13.5px; }
textarea.raw{ font-family:var(--mono); font-size:12.5px; line-height:1.6; }
textarea.big{ min-height:190px; }
textarea:focus.raw,.raw:focus{ border-color:var(--accent); }

/* ============================== TABELE ============================== */
.tbl-wrap{ overflow-x:auto; border:1px solid var(--line); border-radius:var(--radius-sm); }
table.tbl{ width:100%; border-collapse:collapse; font-size:13px; min-width:560px; }
table.tbl th{ text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); font-weight:800; padding:10px 12px; border-bottom:1px solid var(--line); background:var(--surface-2); position:sticky; top:0; z-index:1; }
table.tbl td{ padding:10px 12px; border-bottom:1px solid var(--line); vertical-align:middle; }
table.tbl tr:last-child td{ border-bottom:0; }
table.tbl tbody tr:hover{ background:var(--surface-2); }
table.tbl td.num,table.tbl th.num{ text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
table.tbl td.strong{ font-weight:750; }
table.tbl tfoot td{ font-weight:800; background:var(--surface-2); border-top:2px solid var(--line-strong); }

/* ============================== KANBAN ============================== */
.board{ display:grid; gap:14px; grid-template-columns:repeat(5,minmax(250px,1fr)); align-items:start; }
@media (max-width:1500px){ .board{ grid-template-columns:repeat(3,minmax(250px,1fr)); } }
@media (max-width:1000px){ .board{ grid-template-columns:repeat(2,minmax(240px,1fr)); } }
@media (max-width:660px){ .board{ grid-template-columns:1fr; } }
.column{ background:linear-gradient(180deg,color-mix(in srgb,var(--surface-2) 72%,transparent),transparent); border:1px solid var(--line); border-radius:var(--radius); padding:11px; min-height:130px; transition:background .16s, border-color .16s, box-shadow .16s; }
html[data-contrast="high"] .column{ background:var(--surface); }
.column.drag-over{ border-color:var(--accent); box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 20%,transparent); }
.col-head{ display:flex; align-items:center; gap:9px; padding:3px 5px 11px; }
.col-dot{ width:11px; height:11px; border-radius:50%; flex:0 0 11px; }
.col-head h3{ font-size:13px; flex:1 1 auto; }
.col-count{ font-size:11.5px; font-weight:800; padding:2px 9px; border-radius:99px; background:var(--surface); border:1px solid var(--line-strong); color:var(--text-soft); font-variant-numeric:tabular-nums; }
.col-body{ display:flex; flex-direction:column; gap:11px; min-height:64px; }
.col-empty{ text-align:center; color:var(--muted); font-size:12.5px; padding:18px 8px; border:1.5px dashed var(--line-strong); border-radius:var(--radius-sm); }

.card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow-xs); overflow:hidden; position:relative; transition:transform .16s, box-shadow .16s, border-color .16s; }
.card:hover{ box-shadow:var(--shadow); transform:translateY(-2px); }
.card.dragging{ opacity:.45; }
.card.due-soon{ border-color:var(--orange-line); }
.card.overdue{ border-color:var(--red); box-shadow:0 0 0 3px var(--red-bg), var(--shadow-xs); }
.card.s-delivery::before{ content:""; position:absolute; left:0; top:0; bottom:0; width:5px; background:linear-gradient(180deg,var(--orange),var(--red)); }
.card.s-pickup::before{ content:""; position:absolute; left:0; top:0; bottom:0; width:5px; background:linear-gradient(180deg,var(--accent),var(--pink-strong)); }
.card-inner{ padding:13px 14px 12px 16px; display:flex; flex-direction:column; gap:11px; }
.card-top{ display:flex; align-items:flex-start; gap:10px; }
.card-who{ min-width:0; flex:1 1 auto; }
.card-who .name{ font-size:15.5px; font-weight:800; letter-spacing:-.02em; display:flex; align-items:center; gap:7px; flex-wrap:wrap; }
.card-who .meta{ font-size:12px; color:var(--muted); margin-top:2px; display:flex; gap:9px; flex-wrap:wrap; align-items:center; }
.count{ font-size:12.5px; font-weight:800; padding:6px 11px; border-radius:99px; white-space:nowrap; background:var(--surface-2); border:1px solid var(--line-strong); color:var(--text-soft); font-variant-numeric:tabular-nums; }
.count.soon{ background:var(--orange-bg); border-color:var(--orange-line); color:var(--orange); }
.count.now{ background:var(--red-bg); border-color:var(--red); color:var(--red); }
.count.ok{ background:var(--green-bg); border-color:var(--green-line); color:var(--green); }
.badge{ display:flex; align-items:center; gap:10px; padding:9px 11px; border-radius:var(--radius-sm); border:1px solid; font-size:12.5px; line-height:1.35; }
.badge .ico{ font-size:17px; flex:0 0 auto; }
.badge .txt{ min-width:0; flex:1 1 auto; }
.badge b{ display:block; font-size:11px; letter-spacing:.05em; text-transform:uppercase; font-weight:850; }
.badge .sub{ font-size:12.5px; font-weight:600; word-break:break-word; color:var(--text); }
.badge-delivery{ background:var(--orange-bg); border-color:var(--orange-line); color:var(--orange); }
.badge-pickup{ background:var(--blue-bg); border-color:var(--blue-line); color:var(--blue); }
.mini-link{ font-size:11.5px; font-weight:750; text-decoration:none; padding:5px 9px; border-radius:8px; border:1px solid currentColor; background:var(--surface); flex:0 0 auto; }
.mini-link:hover{ background:var(--surface-3); }
.sect{ border-top:1px dashed var(--line); padding-top:10px; }
.sect:first-child{ border-top:0; padding-top:0; }
.sect-title{ font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; font-weight:850; color:var(--muted); margin-bottom:6px; display:flex; align-items:center; gap:6px; }
.cake-name{ font-size:14px; font-weight:750; }
.cake-sub{ font-size:12.5px; color:var(--text-soft); margin-top:3px; }
.tags{ display:flex; flex-wrap:wrap; gap:5px; margin-top:7px; }
.recipe-toggle{ width:100%; display:flex; align-items:center; justify-content:space-between; gap:8px; padding:9px 11px; border-radius:10px; border:1px solid var(--line-strong); background:var(--surface-2); font-size:12.5px; font-weight:750; text-align:left; }
.recipe-toggle:hover{ background:var(--surface-3); }
.recipe-toggle .caret{ transition:transform .2s; }
.recipe-toggle[aria-expanded="true"] .caret{ transform:rotate(180deg); }
.recipe-body{ margin-top:9px; border:1px solid var(--line); border-radius:var(--radius-sm); overflow:hidden; }
.recipe-sec{ padding:10px 12px; }
.recipe-sec + .recipe-sec{ border-top:1px solid var(--line); }
.recipe-sec h4{ font-size:11px; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); margin-bottom:7px; }
.ing{ display:flex; justify-content:space-between; gap:10px; font-size:12.5px; padding:2.5px 0; }
.ing .nm{ min-width:0; }
.ing .amt{ font-weight:750; font-variant-numeric:tabular-nums; white-space:nowrap; color:var(--accent-2); }
html[data-theme="dark"] .ing .amt{ color:var(--accent); }
.tech-grid{ display:grid; grid-template-columns:1fr 1fr; gap:7px; }
.tech-cell{ background:var(--surface-2); border:1px solid var(--line); border-radius:9px; padding:7px 9px; }
.tech-cell .k{ font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); font-weight:800; }
.tech-cell .v{ font-size:12.5px; font-weight:750; }
.warn-list{ margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:5px; }
.warn-list li{ font-size:12.5px; display:flex; gap:7px; align-items:flex-start; color:var(--text-soft); }
.warn-list li::before{ content:"⚠️"; flex:0 0 auto; font-size:12px; }
.steps{ margin:0; padding-left:18px; display:flex; flex-direction:column; gap:5px; }
.steps li{ font-size:12.5px; color:var(--text-soft); }
.fin{ display:flex; align-items:center; gap:10px; justify-content:space-between; flex-wrap:wrap; }
.amount{ font-size:26px; font-weight:850; letter-spacing:-.04em; font-variant-numeric:tabular-nums; line-height:1; }
.amount small{ font-size:13px; font-weight:750; color:var(--text-soft); margin-left:2px; }
.pay{ text-align:right; font-size:12px; color:var(--text-soft); font-weight:650; }
.badge-paid{ display:inline-block; margin-top:3px; padding:2px 8px; border-radius:99px; font-size:11px; font-weight:800; }
.badge-paid.yes{ background:var(--green-bg); color:var(--green); border:1px solid var(--green-line); }
.badge-paid.no{ background:var(--yellow-bg); color:var(--yellow); border:1px solid var(--yellow-line); }
.card-actions{ display:flex; gap:6px; flex-wrap:wrap; align-items:center; border-top:1px dashed var(--line); padding-top:10px; }
select.status-select{ padding:7px 9px; border-radius:9px; border:1px solid var(--line-strong); background:var(--surface-2); font-size:12px; font-weight:700; }

/* ============================== MODAL ============================== */
.modal-back{ position:fixed; inset:0; z-index:200; background:color-mix(in srgb,var(--espresso) 58%,transparent); backdrop-filter:blur(5px); -webkit-backdrop-filter:blur(5px); display:flex; align-items:flex-start; justify-content:center; padding:clamp(10px,3vw,42px); overflow-y:auto; animation:fade .16s ease; }
html[data-theme="dark"] .modal-back{ background:rgba(0,0,0,.7); }
@keyframes fade{ from{opacity:0} to{opacity:1} }
@keyframes pop{ from{opacity:0; transform:translateY(14px) scale(.985)} to{opacity:1; transform:none} }
@keyframes slideL{ from{opacity:0; transform:translateX(24px)} to{opacity:1; transform:none} }
.modal{ width:100%; max-width:860px; background:var(--surface); border:1px solid var(--line-strong); border-radius:20px; box-shadow:var(--shadow-lg); animation:pop .2s cubic-bezier(.2,.9,.3,1); margin:auto 0; }
.modal.narrow{ max-width:560px; }
.modal.wide{ max-width:1000px; }
.modal.xwide{ max-width:1240px; }
.modal-head{ display:flex; align-items:center; gap:12px; padding:16px 20px; border-bottom:1px solid var(--line); background:linear-gradient(180deg,var(--surface-2),transparent); border-radius:20px 20px 0 0; position:sticky; top:0; z-index:2; }
.modal-head h3{ font-size:16.5px; flex:1 1 auto; }
.modal-head .sub{ font-size:12px; color:var(--muted); font-weight:600; }
.modal-body{ padding:18px 20px; display:flex; flex-direction:column; gap:15px; }
.modal-foot{ display:flex; gap:9px; flex-wrap:wrap; justify-content:flex-end; padding:14px 20px; border-top:1px solid var(--line); background:var(--surface-2); border-radius:0 0 20px 20px; }
.modal-foot .grow{ flex:1 1 auto; }
.tabs{ display:flex; gap:4px; border-bottom:1px solid var(--line); padding:0 20px; background:var(--surface); position:sticky; top:0; z-index:2; overflow-x:auto; }
.tabs button{ border:0; background:transparent; padding:12px 12px; font-size:13px; font-weight:700; color:var(--muted); border-bottom:2.5px solid transparent; white-space:nowrap; }
.tabs button[aria-selected="true"]{ color:var(--accent-2); border-bottom-color:var(--accent); }
.tabpane{ display:none; }
.tabpane.active{ display:block; }

/* ============================== TOAST ============================== */
.toast-root{ position:fixed; z-index:400; right:16px; bottom:16px; display:flex; flex-direction:column; gap:9px; align-items:flex-end; pointer-events:none; }
.toast{ pointer-events:auto; min-width:230px; max-width:min(92vw,400px); background:var(--espresso); color:var(--cream); border:1px solid var(--line-strong); border-radius:13px; padding:12px 15px; box-shadow:var(--shadow-lg); font-size:13.5px; font-weight:650; display:flex; gap:10px; align-items:flex-start; animation:pop .2s cubic-bezier(.2,.9,.3,1); }
html[data-theme="dark"] .toast{ background:var(--surface-3); color:var(--text); }
.toast.ok{ background:var(--green); color:#fff; border-color:var(--green); }
.toast.err{ background:var(--red); color:#fff; border-color:var(--red); }
.toast.warn{ background:var(--yellow); color:#fff; border-color:var(--yellow); }
.toast .ico{ font-size:16px; }
.toast .undo{ margin-left:auto; font-size:12px; font-weight:800; text-decoration:underline; background:none; border:0; color:inherit; }

/* ============================== PALETA POLECEŃ ============================== */
.palette-back{ position:fixed; inset:0; z-index:300; background:color-mix(in srgb,var(--espresso) 50%,transparent); backdrop-filter:blur(6px); display:flex; align-items:flex-start; justify-content:center; padding:12vh 16px 16px; animation:fade .13s ease; }
.palette{ width:100%; max-width:660px; background:var(--surface); border:1px solid var(--line-strong); border-radius:18px; box-shadow:var(--shadow-lg); overflow:hidden; animation:pop .16s ease; }
.palette-in{ display:flex; align-items:center; gap:10px; padding:14px 16px; border-bottom:1px solid var(--line); }
.palette-in input{ border:0; background:transparent; outline:none; font-size:16px; width:100%; }
.palette-list{ max-height:52vh; overflow-y:auto; padding:8px; }
.pal-row{ display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:11px; cursor:pointer; }
.pal-row:hover,.pal-row.sel{ background:var(--accent-soft); }
.pal-row .pi{ font-size:16px; width:22px; text-align:center; }
.pal-row .pt{ flex:1 1 auto; min-width:0; }
.pal-row .pt b{ display:block; font-size:13.5px; }
.pal-row .pt span{ font-size:11.5px; color:var(--muted); }
.pal-row .pk{ font-size:10.5px; font-weight:800; padding:2px 8px; border-radius:99px; background:var(--surface-3); color:var(--muted); text-transform:uppercase; letter-spacing:.05em; }
.pal-empty{ padding:26px; text-align:center; color:var(--muted); font-size:13.5px; }
kbd{ font-family:var(--mono); font-size:11px; padding:2px 6px; border-radius:6px; border:1px solid var(--line-strong); background:var(--surface-2); box-shadow:0 1px 0 var(--line-strong); }

/* ============================== OŚ CZASU / PLAN ============================== */
.timeline{ position:relative; padding-left:26px; }
.timeline::before{ content:""; position:absolute; left:8px; top:6px; bottom:6px; width:2px; background:var(--line); }
.tl-item{ position:relative; padding:0 0 16px 12px; }
.tl-item::before{ content:""; position:absolute; left:-22px; top:5px; width:12px; height:12px; border-radius:50%; background:var(--surface); border:2.5px solid var(--line-strong); }
.tl-item.done::before{ background:var(--green); border-color:var(--green); }
.tl-item.now::before{ background:var(--accent); border-color:var(--accent); box-shadow:0 0 0 5px color-mix(in srgb,var(--accent) 22%,transparent); }
.tl-when{ font-size:11.5px; font-weight:800; color:var(--accent-2); font-variant-numeric:tabular-nums; }
.tl-what{ font-size:13.5px; font-weight:700; }
.tl-note{ font-size:12px; color:var(--muted); }
.tl-card{ background:var(--surface-2); border:1px solid var(--line); border-radius:var(--radius-sm); padding:10px 12px; margin-top:6px; }

/* ============================== KALENDARZ ============================== */
.cal-head{ display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin-bottom:6px; }
.cal-head div{ text-align:center; font-size:11px; font-weight:800; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; padding:4px; }
.cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:6px; }
.cal-day{ min-height:96px; border:1px solid var(--line); border-radius:var(--radius-sm); background:var(--surface); padding:7px; display:flex; flex-direction:column; gap:4px; cursor:pointer; transition:border-color .14s, box-shadow .14s, transform .14s; }
.cal-day:hover{ border-color:var(--accent); transform:translateY(-1px); box-shadow:var(--shadow-xs); }
.cal-day.out{ opacity:.42; background:var(--surface-2); }
.cal-day.today{ border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-soft) inset; }
.cal-day.sel{ border-color:var(--accent-2); box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent); }
.cal-num{ font-size:12.5px; font-weight:800; font-variant-numeric:tabular-nums; }
.cal-num .sum{ float:right; font-size:10.5px; font-weight:800; color:var(--green); }
.cal-ev{ font-size:10.5px; font-weight:700; padding:2px 6px; border-radius:6px; background:var(--surface-3); border:1px solid var(--line); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.cal-ev.pickup{ background:var(--blue-bg); border-color:var(--blue-line); color:var(--blue); }
.cal-ev.delivery{ background:var(--orange-bg); border-color:var(--orange-line); color:var(--orange); }
.cal-more{ font-size:10px; color:var(--muted); font-weight:700; }

/* ============================== WYKRESY ============================== */
.chart-box{ position:relative; width:100%; }
canvas.chart{ width:100%; display:block; border-radius:var(--radius-sm); }
.legend{ display:flex; flex-wrap:wrap; gap:10px; margin-top:10px; }
.legend span{ display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:650; color:var(--text-soft); }
.legend i{ width:11px; height:11px; border-radius:3px; display:inline-block; }

/* ============================== MISC ============================== */
.drop-hint{ font-size:12.5px; color:var(--muted); display:flex; align-items:center; gap:7px; flex-wrap:wrap; }
.preview-box{ border:1px solid var(--line); border-radius:14px; background:var(--surface-2); padding:13px 14px; min-height:170px; }
.preview-title{ font-size:11px; text-transform:uppercase; letter-spacing:.07em; font-weight:850; color:var(--muted); margin-bottom:10px; }
.preview-empty{ color:var(--muted); font-size:13px; font-style:italic; }
.msg-preview{ background:var(--surface-2); border:1px solid var(--line-strong); border-radius:13px; padding:14px 15px; font-size:15px; line-height:1.55; white-space:pre-wrap; word-break:break-word; }
.kv{ display:flex; gap:9px; font-size:13px; padding:3px 0; }
.kv .k{ color:var(--muted); font-weight:750; min-width:120px; }
.kv .v{ font-weight:650; }
.hr{ height:1px; background:var(--line); border:0; margin:4px 0; }
.callout{ border:1px solid var(--line); border-left:4px solid var(--accent); background:var(--surface-2); border-radius:var(--radius-sm); padding:11px 13px; font-size:13px; }
.callout.warn{ border-left-color:var(--yellow); background:var(--yellow-bg); }
.callout.bad{ border-left-color:var(--red); background:var(--red-bg); }
.callout.good{ border-left-color:var(--green); background:var(--green-bg); }
.bar-meter{ height:8px; border-radius:99px; background:var(--surface-4); overflow:hidden; }
.bar-meter i{ display:block; height:100%; background:var(--accent); border-radius:99px; transition:width .4s ease; }
.bar-meter i.green{ background:var(--green); }
.bar-meter i.red{ background:var(--red); }
.empty-state{ text-align:center; padding:38px 16px; color:var(--muted); }
.empty-state .big{ font-size:38px; margin-bottom:8px; }
.listrow{ display:flex; align-items:center; gap:11px; padding:10px 12px; border:1px solid var(--line); border-radius:var(--radius-sm); background:var(--surface); }

const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };

function fmtWhen(iso) {
  if (!iso) return 'Brak terminu';
  const d = new Date(iso);
  if (isNaN(d)) return 'Brak terminu';
  const dd = dayDiff(d, new Date());
  if (dd === 0) return 'Dziś o ' + fmtTime(d);
  if (dd === 1) return 'Jutro o ' + fmtTime(d);
  if (dd === -1) return 'Wczoraj o ' + fmtTime(d);

  return fmtDate(d) + ' o ' + fmtTime(d);
}
function humanGap(ms) {
  const mins = Math.max(0, Math.floor(Math.abs(ms) / 60000));
  const d = Math.floor(mins / 1440), h = Math.floor((mins % 1440) / 60), m = mins % 60;
  if (d > 0) return d + ' d' + (h ? ' ' + h + ' h' : '') + (m ? ' ' + m + ' min' : '');
  if (h > 0) return h + ' h' + (m ? ' ' + m + ' min' : '');

  if (!iso) return { text: 'Brak terminu', cls: 'soon', diff: null };

  if (diff < -60000) return { text: '⏰ Zaległe o ' + humanGap(diff), cls: 'now', diff: diff };

  if (dd === 1) return { text: 'Jutro o ' + fmtTime(d), cls: '', diff: diff };
  return { text: fmtWhen(iso), cls: '', diff: diff };
}

  const blob = new Blob([text], { type: mime || 'application/json;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 400);
}
async function copyText(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); return true; }
    throw new Error('brak API');
  } catch (e) {
    try {
      const ta = document.createElement('textarea');

function toast(msg, kind = 'info', ms = 3200, undoLabel) {

  const t = document.createElement('div');

  t.innerHTML = '<span class="ico">' + (icons[kind] || icons.info) + '</span><span>' + esc(msg) + '</span>' +

}

const RECIPE_LIST = Object.values(RECIPES);
const getRecipe = (id) => RECIPES[id] || null;
const getSize = (r, id) => (r ? (r.sizes.find((s) => s.id === id) || r.sizes[0]) : null);
const baseSize = (r) => r.sizes.find((s) => s.factor === 1) || r.sizes[0];

function roundAmount(v, unit) {
  if (unit === 'szt') return Math.max(0.5, Math.round(v * 2) / 2);
  if (v >= 500) return Math.round(v / 25) * 25;
  if (v >= 100) return Math.round(v / 5) * 5;
  if (v >= 20) return Math.round(v);
  if (v >= 5) return Math.round(v * 2) / 2;
  return Math.round(v * 10) / 10;
}
/** Koszt składnika w PLN dla podanej ilości. */
function ingCost(amount, unit, cost) {
  if (unit === 'szt') return amount * cost;
  return (amount / 1000) * cost;
}
function scaleRecipe(recipe, sizeId) {
  if (!recipe) return { size: null, factor: 1, items: [], cost: 0 };
  const size = getSize(recipe, sizeId);
  const f = size ? size.factor : 1;
  let cost = 0;
  const items = recipe.ingredients.map((ing) => {
    const amount = roundAmount(ing.base * f, ing.unit);
    const c = ingCost(amount, ing.unit, ing.cost);
    cost += c;
    return { name: ing.name, unit: ing.unit, amount, cost: c, cat: ing.cat, allergens: ing.allergens || [] };
  });
  return { size, factor: f, items, cost };
}

function lsGet(key, fallback) {
  try { const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; }
  catch (e) { return fallback; }
}
function lsSet(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); return true; }
  catch (e) { toast('Brak miejsca w pamięci przeglądarki — zrób kopię i wyczyść dane.', 'err', 6000); return false; }
}
function mergeSettings(s) {
  const base = deep(DEFAULT_SETTINGS);
  if (!s) return base;
  const out = deep(base);
  Object.keys(s).forEach((k) => {
    if (s[k] && typeof s[k] === 'object' && !Array.isArray(s[k])) out[k] = Object.assign({}, base[k] || {}, s[k]);
    else out[k] = s[k];
  });
  return out;
}
function saveAll(silent) {
  lsSet(KEYS.orders, store.orders);
  lsSet(KEYS.clients, store.clients);
  lsSet(KEYS.pantry, store.pantry);
  lsSet(KEYS.learn, store.learn);
  lsSet(KEYS.settings, store.settings);
  lsSet(KEYS.shopping, store.shopping);
  if (!silent) store.dirty = false;
}
function loadAll() {
  store.settings = mergeSettings(lsGet(KEYS.settings, null));
  store.orders = (lsGet(KEYS.orders, []) || []).map(normalizeOrder);
  store.clients = lsGet(KEYS.clients, []) || [];
  store.pantry = lsGet(KEYS.pantry, []) || [];
  store.learn = Object.assign({ names: {}, words: {}, accepted: 0 }, lsGet(KEYS.learn, {}));
  store.snapshots = lsGet(KEYS.snaps, []) || [];
  store.shopping = Object.assign({ manual: [], bought: {} }, lsGet(KEYS.shopping, {}));
}
function pushUndo(label) {
  try {
    store.undo.push({ at: Date.now(), label, data: JSON.stringify({ orders: store.orders, clients: store.clients, pantry: store.pantry, shopping: store.shopping }) });
    if (store.undo.length > 25) store.undo.shift();
  } catch (e) { /* ignore */ }
}
function undoLast() {
  const snap = store.undo.pop();
  if (!snap) { toast('Nie ma już czego cofnąć.', 'info', 1800); return; }
  try {
    const d = JSON.parse(snap.data);
    store.orders = d.orders.map(normalizeOrder); store.clients = d.clients; store.pantry = d.pantry; store.shopping = d.shopping;
    saveAll(); renderAll();
    toast('Cofnięto: ' + snap.label, 'ok', 2400);
  } catch (e) { toast('Nie udało się cofnąć zmiany.', 'err'); }
}
function snapshot(label) {
  const entry = { at: new Date().toISOString(), label: label || 'kopia automatyczna', orders: store.orders.length, data: JSON.stringify({ orders: store.orders, clients: store.clients, pantry: store.pantry, settings: store.settings, shopping: store.shopping }) };
  store.snapshots.unshift(entry);
  if (store.snapshots.length > 12) store.snapshots.length = 12;
  lsSet(KEYS.snaps, store.snapshots);
  return entry;
}
function restoreSnapshot(i) {
  const s = store.snapshots[i];
  if (!s) return;
  const d = JSON.parse(s.data);
  store.orders = (d.orders || []).map(normalizeOrder); store.clients = d.clients || []; store.pantry = d.pantry || []; store.shopping = d.shopping || { manual: [], bought: {} };
  if (d.settings) store.settings = mergeSettings(d.settings);
  saveAll(); applySettings(); renderAll();
  toast('Przywrócono kopię z ' + fmtWhen(s.at) + '.', 'ok');
}

const orderItems = (o) => o.items || [];
const itemRecipe = (it) => getRecipe(it.recipeId);
const itemSize = (it) => getSize(itemRecipe(it), it.sizeId);
function itemPrice(it) {
  if (it.priceOverride != null) return it.priceOverride * (it.qty || 1);
  const r = itemRecipe(it), s = itemSize(it);
  return r && s ? s.price * (it.qty || 1) : 0;
}
function orderItemsPrice(o) { return sum(orderItems(o), itemPrice); }
function orderSurchargeSum(o) { return sum(o.finance.surcharges || [], (s) => Number(s.value) || 0); }

/** Koszt własny zamówienia (składniki + opakowania + obsługa). */
function orderCost(o) {
  const cfg = store.settings.pricing;
  let material = 0, cakes = 0;
  orderItems(o).forEach((it) => {
    const r = itemRecipe(it);
    if (!r) return;
    material += scaleRecipe(r, it.sizeId).cost * (it.qty || 1);
    cakes += (it.qty || 1);
  });
  const packaging = cakes * cfg.packagingPerCake;
  const handling = cfg.orderHandling;
  const total = material + packaging + handling;
  return { material, packaging, handling, total, margin: o.finance.amount > 0 ? (o.finance.amount - total) / o.finance.amount : 0 };
}
function suggestedPrice(o) {
  const c = orderCost(o).total;
  const m = store.settings.pricing.targetMargin;
  const raw = m < 1 ? c / (1 - m) : c * 1.6;
  return Math.max(0, Math.round(raw / 5) * 5);

/* ======================= 6. SILNIK NLP — ROZMOWY ========================== */
const escapeRe = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

function cleanChat(text) {
  return String(text || '')
    .split(/\r?\n/)
    .map((l) => l.replace(/[·•]\s*\d{1,2}[:.]\d{2}\s*(am|pm)?/gi, '').trim())
    .filter((l) => {
      if (!l) return false;
      if (/^\d{1,2}[:.]\d{2}(\s*(am|pm))?$/.test(l)) return false;
      if (/^\[?\d{1,2}[.\-/]\d{1,2}([.\-/]\d{2,4})?\]?\s*,?\s*\d{1,2}[:.]\d{2}/.test(l)) return false;
      const n = norm(l);
      if (/^(pon|wt|sr|sro|czw|pt|sob|niedz|ndz)[a-z]*\s*,/.test(n) && /\d{1,2}[:.]\d{2}/.test(l)) return false;
      if (/^(delivered|seen|sent|wyświetlono|wyswietlono|dostarczono|wysłano|wyslano|edytowano|odebrano|today at|yesterday at)\b/i.test(l) && l.length < 44) return false;
      return true;
    })
    .join('\n');
}

/* --- 6.1 TELEFON --- */
function extractPhone(text) {
  const RE = /(?<![\d])(?:\+?\s?48[\s-]?)?(\d(?:[\s-]?\d){8})(?![\d])/g;
  let m, best = null;
  while ((m = RE.exec(text)) !== null) {
    let d = m[1].replace(/\D/g, '');
    if (d.length === 11 && d.startsWith('48')) d = d.slice(2);
    if (d.length !== 9) continue;
    const confident = /^[4-9]/.test(d);
    const rec = { value: d.slice(0, 3) + ' ' + d.slice(3, 6) + ' ' + d.slice(6), digits: d, raw: m[0].trim(), confident };
    if (!best || (!best.confident && confident)) best = rec;
    if (confident) break;
  }
  return best;
}

/* --- 6.2 PROFIL MESSENGERA --- */
function extractMessenger(text) {
  const pats = [
    /m\.me\/([A-Za-z0-9._-]{3,})/i,
    /(?:facebook|fb)\.com\/(?:messages\/t\/|profile\.php\?id=)?([A-Za-z0-9._-]{3,})/i,
    /(?:messenger|profil|nick|fb)\s*[:\-]\s*@?([A-Za-z0-9._-]{3,})/i,
    /(?:^|\s)@([A-Za-z0-9._-]{3,})(?=\s|$|[,.;])/
  ];
  for (const p of pats) { const m = text.match(p); if (m) return { handle: m[1], confident: true }; }
  return { handle: '', confident: false };
}

/* --- 6.3 IMIĘ I NAZWISKO (+ pamięć) --- */
const NAME_STOP = /(dzien dobry|dobry wiecz|dobry|hej|czesc|witam|chcial|prosze|prosz|zamow|dziek|pozdrawiam|zobacz|dostarczono|wyswietlono|edytowano|napis|swieczk|urodzin|jestem zainteresowan|kiedy|ile|czy|jaka|mam pytanie|odpisz|czekam)/i;

function nameLineCandidate(rawLine) {
  const line = rawLine
    .replace(/\([^)]*\)/g, ' ').replace(/\[[^\]]*\]/g, ' ')
    .replace(/\s*[-–—|·]\s*[^A-ZĄĆĘŁŃÓŚŹŻ]*$/, ' ')
    .replace(/\s+/g, ' ').trim();
  if (line.length < 2 || line.length > 42) return null;
  if (/\d/.test(line) || /@|:|\(|\)|!|\?|\/|\[|\]/.test(line)) return null;
  if (!/^[A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]*(?:\s+[A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż-]+){0,2}$/.test(line)) return null;
  if (NAME_STOP.test(norm(line))) return null;
  return line;
}
function extractName(text, ctx) {
  const explicit = text.match(/(?:nazywam\s+si[eę]|jestem\s+tu|z\s+tej\s+strony|tu\s+m[oó]wi|m[oó]wi)\s+([A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+(?:\s+[A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż-]+)?)/i);
  if (explicit) return { value: explicit[1].trim(), confident: 0.95, source: 'wprost' };

  const lines = String(text || '').split(/\r?\n/).map((s) => s.trim()).filter(Boolean);
  const counts = new Map();
  lines.forEach((l) => {
    const c = nameLineCandidate(l);
    if (c) counts.set(c, (counts.get(c) || 0) + 1);
  });
  if (!counts.size) return { value: 'Klient', confident: 0, source: 'brak' };
  const ranked = Array.from(counts.entries()).sort((a, b) => (b[1] - a[1]) || (b[0].length - a[0].length));
  const multi = ranked.filter((r) => r[0].split(/\s+/).length > 1);
  const chosen = (multi.length ? multi : ranked)[0];
  const conf = chosen[1] > 1 ? 0.95 : (ranked.length === 1 ? 0.82 : 0.5);
  return { value: chosen[0], confident: conf, source: chosen[1] > 1 ? 'powtarzalna' : 'heurystyka' };
}

/* --- 6.4 WYPIEK (+ uczenie) --- */
function recipeAliasRegex(na) {
  const last = na.slice(-1);
  let core = escapeRe(na);
  if (/[aeiouy]/.test(last) && na.length >= 4) core = escapeRe(na.slice(0, -1)) + '[aeiouy]';
  const tail = na.length >= 4 ? '[a-z]{0,2}' : '';
  return new RegExp('(^|[^a-z0-9])' + core + tail + '($|[^a-z0-9])');
}
function detectRecipe(text) {
  const t = norm(text);
  const hits = [];
  for (const r of RECIPE_LIST) {
    let best = 0, hit = null;
    for (const a of r.aliases) {
      const na = norm(a);
      if (recipeAliasRegex(na).test(t)) { if (na.length > best) { best = na.length; hit = a; } }
    }
    if (hit) hits.push({ recipe: r, score: best, hit, learned: false });
  }
  /* Pamięć silnika: słowa, których system nauczył się z korekt użytkownika */
  const learned = learnedRecipeHint(t);
  if (learned && !hits.some((h) => h.recipe.id === learned.recipe.id)) {
    hits.push({ recipe: learned.recipe, score: 5, hit: learned.word, learned: true });
  }
  hits.sort((a, b) => (b.score + (b.learned ? 3 : 0)) - (a.score + (a.learned ? 3 : 0)));
  if (!hits.length) return { recipe: null, confident: 0, matches: [] };
  const top = hits[0];
  const second = hits[1];
  const conf = clamp(0.45 + Math.min(top.score, 14) / 20 + (top.learned ? 0.25 : 0) + (!second || top.score > second.score + 2 ? 0.15 : 0), 0, 0.99);
  return { recipe: top.recipe, confident: conf, learned: top.learned, matches: hits.map((h) => ({ id: h.recipe.id, name: h.recipe.name, hit: h.hit, learned: h.learned })) };
}
function learnedRecipeHint(t) {
  const words = t.split(/[^a-z0-9ąćęłńóśźż]+/).filter((w) => w.length >= 4);
  for (const w of words) {
    const l = store.learn.words[w];
    if (l && l.n >= 1 && RECIPES[l.recipeId]) return { recipe: RECIPES[l.recipeId], word: w };
  }
  /* Próbujemy też formy bliskie (serniczek -> sernik) */
  for (const w of words) {
    for (const key in store.learn.words) {
      if (key.length >= 5 && (w.startsWith(key.slice(0, key.length - 1)) || key.startsWith(w.slice(0, w.length - 1)))) {
        const l = store.learn.words[key];
        if (l && RECIPES[l.recipeId]) return { recipe: RECIPES[l.recipeId], word: key };
      }
    }
  }
  return null;
}
function learnRecipeWord(rawText, recipeId) {
  if (!rawText || !recipeId) return;
  const words = norm(rawText).split(/[^a-z0-9ąćęłńóśźż]+/).filter((w) => w.length >= 5 && !NAME_STOP.test(w));
  const known = new Set(RECIPE_LIST.flatMap((r) => r.aliases.map(norm)));
  const generic = new Set(['ciasto', 'tort', 'wypiek', 'zrobic', 'prosze', 'prosze', 'zamowic', 'poprosze', 'chcialabym', 'chcialbym', 'dobry', 'dziekuje', 'byloby', 'mozliwe', 'pieknie', 'byloby', 'moze', 'jakies', 'cos', 'słodkiego', 'slodkiego', 'slodkie', 'slodki']);
  let learned = 0;
  words.forEach((w) => {
    if (known.has(w) || generic.has(w)) return;
    if (!store.learn.words[w]) store.learn.words[w] = { recipeId, n: 0 };
    if (store.learn.words[w].recipeId === recipeId) { store.learn.words[w].n = (store.learn.words[w].n || 0) + 1; learned++; }
  });
  return learned;
}

/* --- 6.5 WIELKOŚĆ --- */
function extractSizeRaw(text) {
  const t = norm(text);
  const out = { cm: null, portions: null, quality: null, blacha: null, raw: '' };
  const cm = t.match(/\b(\d{2})\s*(?:cm|centymetr)/);
  if (cm) { out.cm = parseInt(cm[1], 10); out.raw += cm[0] + ' '; }
  const bl = t.match(/\b(\d{2})\s*[x×]\s*(\d{2})\b/);
  if (bl) { out.blacha = [parseInt(bl[1], 10), parseInt(bl[2], 10)]; out.raw += bl[0] + ' '; }
  const po = t.match(/\b(\d{1,3})\s*(?:porcj\w*|osob\w*|os\.|kawalk\w*|punkt\w*)/);
  if (po) { out.portions = parseInt(po[1], 10); out.raw += po[0] + ' '; }
  const kg = t.match(/\b(\d+(?:[.,]\d+)?)\s*(?:kg|kilogram)/);
  if (kg && !out.portions) { out.portions = Math.round(parseFloat(kg[1].replace(',', '.')) * 8); out.raw += kg[0] + ' '; }
  if (/\b(duz\w*|wielk\w*|wieksz\w*)\b/.test(t)) { out.quality = 'duza'; out.raw += 'duża '; }
  else if (/\b(mal\w*|niewielk\w*|mniejsz\w*)\b/.test(t)) { out.quality = 'mala'; out.raw += 'mała '; }
  else if (/\b(sredn\w*)\b/.test(t)) { out.quality = 'srednia'; out.raw += 'średnia '; }
  out.raw = out.raw.trim();
  return out;
}
function matchSize(recipe, raw) {
  if (!recipe) return { size: null, confident: 0, source: 'brak wypieku' };
  const sizes = recipe.sizes, base = baseSize(recipe), baseCm = recipe.baseCm;
  let target = null, source = '';
  if (raw.cm && baseCm) { target = Math.pow(raw.cm / baseCm, 2); source = 'średnica ' + raw.cm + ' cm'; }
  else if (raw.blacha && !baseCm) {
    const area = raw.blacha[0] * raw.blacha[1];
    const m = base.label.match(/(\d+)\s*[x×]\s*(\d+)/);
    const baseArea = m ? parseInt(m[1], 10) * parseInt(m[2], 10) : area;
    target = area / baseArea; source = 'blacha ' + raw.blacha.join('×') + ' cm';
  } else if (raw.portions) { target = raw.portions / base.portions; source = raw.portions + ' porcji'; }
  else if (raw.quality) {
    const idx = raw.quality === 'duza' ? sizes.length - 1 : raw.quality === 'mala' ? 0 : Math.floor(sizes.length / 2);
    return { size: sizes[idx], confident: 0.4, source: 'opisowo: ' + raw.quality };
  } else return { size: base, confident: 0.35, source: 'domyślnie ' + base.label };

  let best = sizes[0], err = Infinity;
  for (const s of sizes) { const e = Math.abs(Math.log(s.factor / target)); if (e < err) { err = e; best = s; } }
  const conf = err < 0.05 ? 0.95 : err < 0.12 ? 0.75 : 0.45;
  return { size: best, confident: conf, source };
}

/* --- 6.6 WIELE POZYCJI W JEDNYM ZAMÓWIENIU --- */
const QTY_WORDS = { jeden: 1, jedna: 1, jedno: 1, dwa: 2, dwie: 2, trzy: 3, cztery: 4, piec: 5, szesc: 6, siedem: 7, osiem: 8, dziewiec: 9, dziesiec: 10 };
function qtyBefore(t, idx) {
  const before = t.slice(Math.max(0, idx - 26), idx);
  const w = before.match(/\b(jeden|jedna|jedno|dwa|dwie|trzy|cztery|piec|szesc|siedem|osiem|dziewiec|dziesiec)\s*$/);
  if (w) return QTY_WORDS[w[1]] || 1;
  const d = before.match(/(\d{1,2})\s*(?:x|szt\.?|razy)?\s*$/);
  if (d) { const v = parseInt(d[1], 10); if (v >= 1 && v <= 20) return v; }
  return 1;
}
function detectItems(text) {
  const t = norm(text);
  const found = [];
  for (const r of RECIPE_LIST) {
    let idx = -1, hit = null;
    for (const a of r.aliases) {
      const re = new RegExp(recipeAliasRegex(norm(a)).source, 'g');
      const m = re.exec(t);
      if (m && (idx === -1 || m.index < idx)) { idx = m.index; hit = a; }
    }
    if (idx >= 0) found.push({ recipe: r, idx, hit });
  }
  const learned = learnedRecipeHint(t);
  if (learned && !found.some((f) => f.recipe.id === learned.recipe.id)) {
    const idx = t.indexOf(learned.word);
    found.push({ recipe: learned.recipe, idx: idx < 0 ? t.length : idx, hit: learned.word, learned: true });
  }
  found.sort((a, b) => a.idx - b.idx);
  return found.map((f) => {
    const win = t.slice(Math.max(0, f.idx - 70), f.idx + 70);
    const rawSize = extractSizeRaw(win);
    const m = matchSize(f.recipe, rawSize);
    return {
      recipeId: f.recipe.id,
      sizeId: m.size ? m.size.id : (baseSize(f.recipe) || {}).id,
      qty: qtyBefore(t, f.idx),
      sizeConfident: m.confident,
      sizeSource: m.source,
      hit: f.hit,
      learned: !!f.learned
    };
  });
}

function extractCustomizations(text) {
  const personal = [], allergens = [];

/* --- 6.8 LOGISTYKA I ADRES --- */
function extractAddress(text) {
  const res = { street: '', postal: '', city: '', full: '' };
  const pm = text.match(/\b(\d{2})\s?-\s?(\d{3})\b/);
  if (pm) res.postal = pm[1] + '-' + pm[2];
  const keyRe = /\b(ul\.?|ulica|al\.?|aleja|os\.?|osiedle|pl\.?|plac|rondo|skwer)\s+([^\n]{3,70})/i;
  const m = text.match(keyRe);
  if (m) {
    let s = m[2].split(/\n/)[0];
    s = s.replace(/\b\d{2}\s?-\s?\d{3}\b[\s\S]*$/, '');
    s = s.replace(/\b(w|we|do|na|prosz[eę]|zap[łl]at\w*|p[łl]atno\w*|godz\w*|o\s+\d)[\s\S]*$/i, '');
    s = s.replace(/[\s,;.]+$/, '').trim();
    const toks = s.split(/\s+/).filter(Boolean);
    if (toks.length > 6) s = toks.slice(0, 5).join(' ');
    const prefix = /^ul/i.test(m[1]) ? 'ul. ' : (/^al/i.test(m[1]) ? 'al. ' : m[1].trim() + ' ');
    res.street = s ? prefix + s : '';
  } else if (res.postal) {
    const m2 = text.match(/([A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+(?:\s+[A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+)?\s+\d+[A-Za-z]?)\s*,?\s*(\d{2}-\d{3})/);
    if (m2) res.street = m2[1].trim();
  }
  if (res.postal) {
    const idx = text.indexOf(res.postal);
    const after = text.slice(idx + res.postal.length);
    const cm = after.match(/^[\s,]*([A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż-]{2,30})/);
    if (cm) res.city = cm[1];
  }
  const parts = [];
  if (res.street) parts.push(res.street);
  const tail = [res.postal, res.city].filter(Boolean).join(' ');
  if (tail && !res.street.includes(tail)) parts.push(tail);
  res.full = parts.join(', ');
  return res;
}
function extractLogistics(text) {
  const clean = cleanChat(text);
  const t = norm(clean);
  const deliveryRe = /\b(dostaw\w*|przywie\w*|kurier|na\s+adres|pod\s+dom)\b/;
  const pickupRe = /\b(odbi[oó]r\w*|odbier\w*|podjad\w*|osobi[śs]cie|przyjd\w*|przyje[dt]\w*|w\s+domu|u\s+pani|u\s+ciebie|na\s+miejscu)\b/;
  const hasDelivery = deliveryRe.test(t) || /\bul\.|\bulic|kod pocztow|\d{2}-\d{3}/i.test(clean);
  const hasPickup = pickupRe.test(t);
  const address = extractAddress(clean);
  let type = 'pickup';
  if (hasDelivery && !hasPickup) type = 'delivery';
  else if (hasDelivery && hasPickup) type = address.full ? 'delivery' : 'pickup';
  const conf = type === 'delivery' ? (address.full ? 0.9 : 0.5) : (hasPickup ? 0.9 : 0.4);
  let window = null;
  const wm = t.match(/\bmiedzy\s+(\d{1,2})(?::(\d{2}))?\s+a\s+(\d{1,2})(?::(\d{2}))?\b/);
  if (wm) window = { from: parseInt(wm[1], 10) + ':' + (wm[2] || '00'), to: parseInt(wm[3], 10) + ':' + (wm[4] || '00') };
  return { type, address, confident: conf, window };
}

function detectWeekday(t) { for (const [re, n] of WEEKDAY_PATTERNS) if (re.test(t)) return n; return null; }
function nextWeekday(now, target) {
  const cur = startOfDay(now).getDay();

function findNumericDate(t) {
  const unitAfter = /^\s*(kg|g\b|ml|cm|porcj|osob|os\.|zl|pln|kawal)/;
  const timeBefore = /\b(o|godz\.?|godzinie|ok\.?|około|okolo|przed)\s+$/;
  const re = /(\d{1,2})[.\-](\d{1,2})(?:[.\-](\d{2,4}))?(?![\d])/g;
  let m;
  while ((m = re.exec(t)) !== null) {
    if (m.index > 0 && /[\dA-Za-z]/.test(t[m.index - 1])) continue;
    if (timeBefore.test(t.slice(Math.max(0, m.index - 6), m.index))) continue;
    const day = parseInt(m[1], 10), mon = parseInt(m[2], 10);
    if (day < 1 || day > 31 || mon < 1 || mon > 12) continue;
    if (unitAfter.test(t.slice(m.index + m[0].length))) continue;
    return m;
  }
  const re2 = /(\d{1,2})\/(\d{1,2})\/(\d{2,4})(?![\d])/g;
  while ((m = re2.exec(t)) !== null) {
    const day = parseInt(m[1], 10), mon = parseInt(m[2], 10);

}
function parseDue(originalText, now) {
  const t = norm(cleanChat(originalText));
  const res = { iso: null, dateFound: false, timeFound: false, note: '', snippet: '', confident: 0 };
  const zaDni = t.match(/\bza\s+(\d{1,2})\s+dni?\b/);
  const zaTydz = /\bza\s+tydzie[nń]|\bw\s+przysz[łl]ym\s+tygodniu/.test(t);
  const pojutrze = /\bpojutrze\b/.test(t);
  const jutro = /\b(jutro|na\s+jutro)\b/.test(t);
  const dzis = /\b(dzi[śs]|dzisiaj|na\s+dzi[śs]|na\s+dzisiaj|dzisiejszy)\b/.test(t);
  const monthsM = t.match(/\b(\d{1,2})\s+(stycznia|lutego|marca|kwietnia|maja|czerwca|lipca|sierpnia|wrzesnia|pazdziernika|listopada|grudnia)\b/);
  const numDateM = findNumericDate(t);
  const weekday = detectWeekday(t);
  let base = null, dateToken = '';

  if (monthsM) {
    const day = parseInt(monthsM[1], 10);
    const mi = ['stycznia', 'lutego', 'marca', 'kwietnia', 'maja', 'czerwca', 'lipca', 'sierpnia', 'wrzesnia', 'pazdziernika', 'listopada', 'grudnia'].indexOf(monthsM[2]);
    let y = now.getFullYear();
    let d = new Date(y, mi, day);
    if (dayDiff(d, now) < 0) { y += 1; d = new Date(y, mi, day); }
    base = d; res.dateFound = true; dateToken = monthsM[0];
  } else if (numDateM) {
    const day = parseInt(numDateM[1], 10), mon = parseInt(numDateM[2], 10);
    let y = now.getFullYear();
    if (numDateM[3]) { const yy = parseInt(numDateM[3], 10); y = yy < 100 ? 2000 + yy : yy; }
    let d = new Date(y, mon - 1, day);
    if (!numDateM[3] && dayDiff(d, now) < 0) d = new Date(y + 1, mon - 1, day);
    base = d; res.dateFound = true; dateToken = numDateM[0];
  } else if (zaDni) { base = addDays(startOfDay(now), parseInt(zaDni[1], 10)); res.dateFound = true; }
  else if (zaTydz) { base = addDays(startOfDay(now), 7); res.dateFound = true; }
  else if (pojutrze) { base = addDays(startOfDay(now), 2); res.dateFound = true; }
  else if (jutro) { base = addDays(startOfDay(now), 1); res.dateFound = true; }
  else if (dzis) { base = startOfDay(now); res.dateFound = true; }
  else if (weekday !== null) { base = nextWeekday(now, weekday); res.dateFound = true; }

  let hh = null, mm = 0;
  const tTime = dateToken ? t.replace(dateToken, ' ') : t;
  const colon = tTime.match(/(?<![\d:])([01]?\d|2[0-3]):([0-5]\d)(?![\d])/);
  if (colon) { hh = parseInt(colon[1], 10); mm = parseInt(colon[2], 10); res.timeFound = true; res.snippet = (dateToken ? dateToken + ' ' : '') + colon[0]; }
  else {
    const kw = tTime.match(/\b(?:o|na|do|godz\.?|godzinie|ok\.?|około|okolo|przed)\s+([01]?\d|2[0-3])(?:[.,](\d{2}))?(?![\d])/);
    if (kw) { hh = parseInt(kw[1], 10); mm = kw[2] ? parseInt(kw[2], 10) : 0; res.timeFound = true; res.snippet = (dateToken ? dateToken + ' ' : '') + kw[0]; }
  }

  if (res.dateFound && res.timeFound) {
    const d = new Date(base); d.setHours(hh, mm, 0, 0);
    if (d.getTime() < now.getTime() - 60000) res.note = 'Termin wypada w przeszłości — sprawdź datę!';
    res.iso = d.toISOString();
    res.confident = weekday !== null || monthsM || numDateM || jutro || pojutrze || dzis ? 0.95 : 0.8;
  } else if (res.dateFound) {
    const d = new Date(base); d.setHours(12, 0, 0, 0);
    res.iso = d.toISOString(); res.note = 'Brak godziny — ustawiono 12:00.'; res.confident = 0.55;
  } else if (res.timeFound) {
    const d = new Date(now); d.setHours(hh, mm, 0, 0);
    if (d.getTime() < now.getTime()) d.setDate(d.getDate() + 1);
    res.iso = d.toISOString(); res.dateFound = true;
    res.note = 'Brak daty — przyjęto najbliższy dzień.'; res.confident = 0.5;
  } else { res.note = 'Nie wykryto terminu.'; res.confident = 0; }
  return res;
}

/* --- 6.10 FINANSE --- */
function extractFinance(text, priceHint) {
  const t = norm(text);
  const out = { amount: null, amountConfident: 0, payment: '', paymentConfident: 0, paid: false, budget: null, source: '' };
  const am = t.match(/\b(\d{2,4})(?:[.,](\d{2}))?\s*(?:zl\b|pln\b|zlotych)/);
  const bud = t.match(/\b(?:do|maks|max|maksymalnie|budzet|budżet)\s*(\d{2,4})\s*(?:zl|pln|zlotych)?\b/);
  if (bud) out.budget = parseInt(bud[1], 10);
  if (am) { out.amount = parseFloat(am[1] + (am[2] ? '.' + am[2] : '')); out.amountConfident = 0.95; out.source = 'z rozmowy'; }
  else if (priceHint) { out.amount = priceHint; out.amountConfident = 0.5; out.source = 'cennik'; }

  if (/\bblik\b/.test(t)) { out.payment = 'BLIK'; out.paymentConfident = 0.95; }
  else if (/\b(przelew\w*|bank\w*|przelewu|paypal|payu)\b/.test(t)) { out.payment = 'Przelew bankowy'; out.paymentConfident = 0.95; }
  else if (/\b(kart[aę]|terminal)\b/.test(t)) { out.payment = 'Karta'; out.paymentConfident = 0.9; }
  else if (/\b(got[oó]wk\w*|cash|na\s+miejscu|przy\s+odbiorze)\b/.test(t)) { out.payment = 'Gotówka przy odbiorze'; out.paymentConfident = 0.9; }
  else { out.payment = 'Gotówka przy odbiorze'; out.paymentConfident = 0.3; }
  out.paid = /\b(zap[łl]acon\w*|op[łl]acon\w*|zap[łl]aci[łl]\w*|przelew\s+poszed[łl]|wys[łl]a[łl]am\s+przelew|ju[żz]\s+zap[łl]acone|zadatek|zadatku)\b/.test(t);
  return out;
}

/* --- 6.11 SENTYMENT, PILNOŚĆ, TYP KLIENTA --- */
const POS_WORDS = /\b(dzi[eę]kuj\w*|super|świetn\w*|swietn\w*|pyszn\w*|polecam|kocham|cudown\w*|rewelacj\w*|pi[eę]kn\w*|prosz[eę]|uprzejm\w*)\b|😊|😍|🥰|❤️|🙏|🎉/;
const NEG_WORDS = /\b(niestety|problem|reklamacj\w*|sp[oó][źz]ni\w*|z[łl]e|rozczarowan\w*|nie\s+dzia[łl]a|zwrot|zwrotu)\b|😡|😠|🙁|😞/;
const URGENT_WORDS = /\b(pilne|na\s+ju[żz]|jak\s+najszybciej|ekspres|natychmiast|dzisiaj|na\s+dzi[śs]|szybko|ju[żz]\s+dzisiaj|na\s+wtorek\s+rano)\b/;
function analyzeTone(text) {
  const t = norm(text);
  let sentiment = 'neutral', score = 0;
  if (POS_WORDS.test(text)) { sentiment = 'pozytywny'; score += 1; }
  if (NEG_WORDS.test(text)) { sentiment = 'negatywny'; score -= 2; }
  let urgency = 0;
  if (URGENT_WORDS.test(t)) urgency += 2;
  if (/\bna\s+dzisiaj|na\s+dzi[śs]|za\s+godzin\w*|za\s+\d+\s*h\b/.test(t)) urgency += 2;
  if (/\?\?|!!!|bardzo\s+prosz/.test(text)) urgency += 1;
  const words = t.split(/\s+/).length;
  if (words > 90) urgency = Math.max(0, urgency - 1);
  return { sentiment, score, urgency: clamp(urgency, 0, 4) };
}

/* --- 6.12 GŁÓWNY PARSER --- */
function parseChat(raw) {

  const name = extractName(text);
  const phone = extractPhone(text);
  const messenger = extractMessenger(text);
  const recipeHit = detectRecipe(text);
  const items = detectItems(text);
  const sizeRaw = extractSizeRaw(text);
  const globalSize = matchSize(recipeHit.recipe, sizeRaw);
  const custom = extractCustomizations(text);
  const logistics = extractLogistics(text);
  const due = parseDue(text, now);
  const tone = analyzeTone(text);

  let itemList = items;

    itemList = recipeHit.recipe ? [{ recipeId: recipeHit.recipe.id, sizeId: globalSize.size ? globalSize.size.id : null, qty: 1, sizeConfident: globalSize.confident, sizeSource: globalSize.source }] : [];

  if (tone.urgency >= 3) warnings.push('Wysoka pilność — klient oczekuje szybkiej realizacji.');

/** Rozdziela wklejony tekst na osobne rozmowy (gdy wklejono kilka czatów). */
function splitConversations(text) {
  const lines = String(text || '').split(/\r?\n/);
  const groups = [];
  let current = { name: '', lines: [] };
  groups.push(current);
  for (const line of lines) {
    const cand = nameLineCandidate(line.trim());
    if (cand) {
      const hasContent = current.lines.join('').trim().length > 12;
      if (current.name !== cand && hasContent) { current = { name: cand, lines: [] }; groups.push(current); }
      else if (!current.name) current.name = cand;
    }
    current.lines.push(line);
  }
  return groups.filter((g) => g.lines.join('').trim().length > 0);
}

/* ==================== 7. SILNIK OPERACYJNY I ANALITYKA =================== */
const orderTotal = (o) => Number(o.finance.amount) || 0;
const orderPaid = (o) => orderTotal(o) * (o.finance.paid ? 1 : 0) + (o.finance.deposit || 0);
const orderToPay = (o) => Math.max(0, orderTotal(o) - (o.finance.paid ? orderTotal(o) : (o.finance.deposit || 0)));

}
function confidencePill(v) {

/* --- 7.1 PLANOWANIE WSTECZNE PRODUKCJI --- */
function techAggregate(o) {
  const agg = { bakeMinutes: 30, coolHours: 1, chillHours: 2, decorHours: 0.5, prepHours: 0.75, cakes: 0 };
  let found = false;
  orderItems(o).forEach((it) => {
    const r = itemRecipe(it);
    if (!r) return;
    found = true;
    const q = it.qty || 1;
    agg.cakes += q;
    agg.bakeMinutes = Math.max(agg.bakeMinutes, r.tech.bakeMinutes * (q > 1 ? 1.25 : 1));
    agg.coolHours = Math.max(agg.coolHours, r.tech.coolHours);
    agg.chillHours = Math.max(agg.chillHours, r.tech.chillHours);
    agg.decorHours = Math.max(agg.decorHours, r.tech.decorHours);
    agg.prepHours = Math.max(agg.prepHours, r.tech.prepHours);
  });
  if (!found) return null;
  const cfg = store.settings.production;
  const batches = Math.ceil(agg.cakes / Math.max(1, cfg.ovenCapacity));
  if (batches > 1) agg.bakeMinutes = agg.bakeMinutes * batches;
  return agg;
}
function orderTimeline(o) {
  const agg = techAggregate(o);
  if (!agg || !o.logistics.dueAt) return [];
  const cfg = store.settings.production;
  const due = new Date(o.logistics.dueAt);
  const steps = [];
  const push = (key, label, emoji, start, end, note) => steps.push({ key, label, emoji, start, end, note: note || '' });

  const packStart = addMinutes(due, -cfg.packMinutes);
  const decorStart = addMinutes(packStart, -agg.decorHours * 60);
  const chillStart = addMinutes(decorStart, -agg.chillHours * 60);
  const coolStart = addMinutes(chillStart, -agg.coolHours * 60);
  const bakeStart = addMinutes(coolStart, -agg.bakeMinutes);
  const prepStart = addMinutes(bakeStart, -agg.prepHours * 60);
  const shopStart = addMinutes(prepStart, -store.settings.production.shopLeadHours * 60);

  push('shop', 'Zakupy i przygotowanie składników', '🛒', shopStart, prepStart, 'Wszystko musi być w temperaturze pokojowej.');
  push('prep', 'Przygotowanie i odmierzanie', '🥣', prepStart, bakeStart, 'Formy wysmarowane, piekarnik włączony 25 min wcześniej.');
  push('bake', 'Pieczenie', '🔥', bakeStart, coolStart, 'Nie otwierać piekarnika!');
  push('cool', 'Studzenie', '💨', coolStart, chillStart, agg.coolHours + ' h');
  if (agg.chillHours > 0) push('chill', 'Chłodzenie / stabilizacja', '❄️', chillStart, decorStart, agg.chillHours + ' h w lodówce');
  if (agg.decorHours > 0) push('decor', 'Dekorowanie i wykończenie', '🎨', decorStart, packStart, '');
  push('pack', 'Pakowanie i wydanie', '📦', packStart, due, 'Sprawdź personalizacje i alergeny!');
  return steps.map((s) => ({ ...s, state: s.end < new Date() ? 'done' : (s.start <= new Date() && new Date() <= s.end) ? 'now' : 'todo' }));
}
function nextProductionStep(o) {
  const tl = orderTimeline(o);
  const next = tl.find((s) => s.state !== 'done');
  return next || null;
}
function productionStarts(o) {
  const tl = orderTimeline(o);
  const baked = tl.find((s) => s.key === 'bake');
  return baked ? baked.start : null;
}
function ovenConflicts(dayDate) {
  const wins = [];
  store.orders.filter((o) => o.status !== 'done' && o.logistics.dueAt && sameDay(new Date(o.logistics.dueAt), dayDate)).forEach((o) => {
    const tl = orderTimeline(o);
    const bake = tl.find((s) => s.key === 'bake');
    if (bake) wins.push({ o, start: bake.start, end: bake.end });
  });
  wins.sort((a, b) => a.start - b.start);
  const conflicts = [];
  const capacity = Math.max(1, store.settings.production.ovenCapacity);
  for (let i = 0; i < wins.length; i++) {
    let overlapping = 1;
    for (let j = 0; j < wins.length; j++) if (j !== i && wins[j].start < wins[i].end && wins[i].start < wins[j].end) overlapping++;
    if (overlapping > capacity && !conflicts.some((c) => c.ids.includes(wins[i].o.id))) {
      const group = wins.filter((w) => w.start < wins[i].end && wins[i].start < w.end).map((w) => w.o);
      conflicts.push({ ids: group.map((o) => o.id), at: wins[i].start, orders: group });
    }
  }
  return { windows: wins, conflicts };
}

/* --- 7.2 ALERTY --- */
function buildAlerts() {
  const now = new Date();
  const out = [];
  store.orders.filter((o) => o.status !== 'done').forEach((o) => {
    const due = o.logistics.dueAt ? new Date(o.logistics.dueAt) : null;
    if (due) {
      const h = (due - now) / 3600000;
      if (h < 0) out.push({ level: 'bad', ico: '⏰', text: 'Zaległe wydanie: ' + o.client.name + ' (' + fmtWhen(o.logistics.dueAt) + ')', orderId: o.id });
      else if (h < 3) out.push({ level: 'warn', ico: '⏳', text: 'Wydanie za mniej niż 3 h: ' + o.client.name + ' o ' + fmtTime(due), orderId: o.id });
    }
    const next = nextProductionStep(o);
    if (next && next.state !== 'done' && due && (due - now) / 3600000 < 72) {
      out.push({ level: 'info', ico: next.emoji, text: next.label + ' — ' + o.client.name + ' · ' + fmtTime(next.start), orderId: o.id });
    }
    if (o.status === 'new') out.push({ level: 'warn', ico: '🆕', text: 'Zamówienie czeka na zatwierdzenie: ' + o.client.name, orderId: o.id });
    if (!o.finance.paid && due && due < now) out.push({ level: 'bad', ico: '💸', text: 'Nieopłacone po terminie: ' + o.client.name + ' · ' + fmtMoney(orderTotal(o)) + ' zł', orderId: o.id });
    if (!o.client.phone && !o.client.messenger) out.push({ level: 'info', ico: '📇', text: 'Brak danych kontaktowych: ' + o.client.name, orderId: o.id });
  });
  if (dueConflictsToday()) {
    out.unshift({ level: 'warn', ico: '🔥', text: 'Kolizja piekarnika: ' + dueConflictsToday() + ' nakładających się wypieków w planie.', orderId: '' });
  }
  const rank = { bad: 0, warn: 1, info: 2 };
  out.sort((a, b) => rank[a.level] - rank[b.level]);
  return out;
}
function dueConflictsToday() {
  return ovenConflicts(new Date()).conflicts.length;
}

/* --- 7.3 LISTA ZAKUPÓW --- */
function ordersForShopping(range) {
  const now = new Date();
  let list = store.orders.filter((o) => o.status !== 'done');
  if (range === 'today') list = list.filter((o) => o.logistics.dueAt && sameDay(new Date(o.logistics.dueAt), now));
  else if (range === 'week') list = list.filter((o) => o.logistics.dueAt && dayDiff(new Date(o.logistics.dueAt), now) <= 7 && dayDiff(new Date(o.logistics.dueAt), now) >= 0);
  else if (range === 'planned') list = list.filter((o) => o.status === 'planned' || o.status === 'baking');
  return list;
}
function aggregatedShopping(range) {
  const orders = ordersForShopping(range);
  const map = new Map();
  orders.forEach((o) => {
    orderItems(o).forEach((it) => {
      const r = itemRecipe(it);
      if (!r) return;
      const sc = scaleRecipe(r, it.sizeId);
      sc.items.forEach((ing) => {
        const key = norm(ing.name) + '|' + ing.unit;
        if (!map.has(key)) map.set(key, { key, name: ing.name, unit: ing.unit, qty: 0, cost: 0, cat: ing.cat, orders: [] });
        const row = map.get(key);
        const q = ing.amount * (it.qty || 1);
        row.qty += q;
        row.cost += ingCost(q, ing.unit, (r.ingredients.find((x) => x.name === ing.name) || {}).cost || 0);
        if (!row.orders.includes(o.id)) row.orders.push(o.id);
      });
    });
  });
  const pantryMap = new Map();
  store.pantry.forEach((p) => { pantryMap.set(norm(p.name) + '|' + p.unit, p); });
  return Array.from(map.values()).map((row) => {
    const p = pantryMap.get(row.key);
    const have = p ? Math.min(p.qty, row.qty) : 0;
    return { ...row, have, toBuy: Math.max(0, row.qty - have), unitCost: row.qty ? row.cost / row.qty : 0 };
  }).sort((a, b) => (catMeta(a.cat).name).localeCompare(catMeta(b.cat).name) || a.name.localeCompare(b.name));
}
